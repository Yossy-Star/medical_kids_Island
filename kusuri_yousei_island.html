  fever:        { id:"fever",        objType:"hotspring",   label:"はつねつ", startMsg:"♨️ 頭が熱っぽくなってきた… タップして直そう", fixMsg:"かろばーどが熱をひかせたよ！" }
};
const HAPPENING_INTERVAL_MS = 10 * 60 * 1000; // 10 minutes — change this to tune frequency

function fairyCanFix(fairyType, happeningId){
  const t = FAIRY_TYPES[fairyType];
  if(!t || !t.canFix) return false;
  return t.canFix === "all" || t.canFix.includes(happeningId);
}

/* wires "tap (without dragging) resolves the matching active happening"
   onto any object — rocks, the spring, a flower, a virus, whatever
   matchFn identifies. Mirrors the fairy tap/drag pattern so it plays
   nicely with panning and edit-mode placement. */
function wireHappeningTap(dom, matchFn){
  let down=false, moved=false, downX=0, downY=0;
  dom.addEventListener("pointerdown", (e)=>{
    if(state.placingType) return; // edit-mode placement/eraser owns taps then
    e.stopPropagation();
    down = true; moved = false;
    const p = svgPoint(e);
    downX = p.x; downY = p.y;
  });
  dom.addEventListener("pointermove", (e)=>{
    if(!down) return;
    const p = svgPoint(e);
    if(Math.hypot(p.x-downX, p.y-downY) > 5) moved = true;
  });
  const release = ()=>{
    if(!down) return;
    down = false;
    if(moved) return;
    const h = state.activeHappenings.find(matchFn);
    if(!h) return;
    dispatchFairy(h);
  };
  dom.addEventListener("pointerup", release);
  dom.addEventListener("pointercancel", ()=>{ down = false; });
}

/* a few sparkles that pop and fade — used when the hot spring cools down */
function burstSparkle(parentDom){
  for(let i=0;i<6;i++){
    const ang = Math.random()*Math.PI*2;
    const dist = 16 + Math.random()*22;
    const star = el("text", {x:(Math.cos(ang)*dist).toFixed(1), y:(Math.sin(ang)*dist).toFixed(1), "font-size":16, "text-anchor":"middle", class:"onsen-spark"});
    star.textContent = "✨";
    star.style.animationDelay = (Math.random()*0.15).toFixed(2)+"s";
    parentDom.appendChild(star);
    setTimeout(()=> star.remove(), 900);
  }
}

function pickAvailableSpot(objType){
  const used = new Set(state.activeHappenings.map(h => h.targetObj).filter(Boolean));
  const candidates = state.objects.filter(o => o.type === objType && !used.has(o));
  if(candidates.length === 0) return null;
  return candidates[Math.floor(Math.random()*candidates.length)];
}

/* now unused — the gutflora happening targets one specific flower object
   (mainFlowerObj) exactly like rock/spiderweb/whirlpool/hotspring do,
   instead of a bounding-box zone over the whole patch. Removed rather
   than left dead, since field-zone's CSS rule goes with it too. */

function triggerHappening(forcedId){
  // "germs" isn't picked here anymore — every virus on the island is
  // always its own live happening from the moment it spawns (see
  // scatterViruses/spawnVirus), so there's nothing to randomly "trigger".
  const ids = Object.keys(HAPPENING_TYPES).filter(id => id !== "germs");
  const activeIds = new Set(state.activeHappenings.map(h => h.typeId));
  let choices = forcedId ? [forcedId] : ids.filter(id => !activeIds.has(id));
  if(choices.length === 0) choices = ids; // everything's already active — pile on anyway
  const typeId = choices[Math.floor(Math.random()*choices.length)];
  const def = HAPPENING_TYPES[typeId];

  let targetObj = null, x, y;

  if(def.objType === "flowerpatch"){
    if(!mainFlowerObj) return; // no curated flowers placed yet — nothing to target
    // the whole curated bed droops, as a broader "the garden's not doing
    // well" cue, but only the one big centre flower actually glows/is
    // the tap target — see the comment by mainFlowerObj's own definition
    state.objects.filter(o => o.type === "flower" && o.curated).forEach(o => { o.dom.classList.add("happening-wilted"); });
    targetObj = mainFlowerObj;
    targetObj.dom.classList.add("happening-active");
    const s = ATTENTION_SPARK_SPEC.flower;
    addAttentionSpark(targetObj.dom, s.cx, s.cy, s.r);
    bringToHappeningFront(targetObj.dom);
    x = targetObj.x; y = targetObj.y;
  } else if(def.objType === "hotspring"){
    targetObj = state.objects.find(o => o.type === "hotspring");
    if(!targetObj) return;
    targetObj.dom.classList.add("onsen-steaming");
    const s = ATTENTION_SPARK_SPEC.hotspring;
    addAttentionSpark(targetObj.dom, 0, s.cy, s.r);
    bringToHappeningFront(targetObj.dom);
    x = targetObj.x; y = targetObj.y;
  } else {
    // rock / spiderweb / whirlpool: normally invisible, reveal one now
    targetObj = pickAvailableSpot(def.objType);
    if(!targetObj) return; // no free marker of this type right now
    targetObj.dom.classList.remove("happening-hidden");
    targetObj.dom.classList.add("happening-active");
    const s = ATTENTION_SPARK_SPEC[def.objType] || {cy:0, r:24};
    addAttentionSpark(targetObj.dom, 0, s.cy, s.r);
    bringToHappeningFront(targetObj.dom);
    x = targetObj.x; y = targetObj.y;
  }

  state.activeHappenings.push({typeId, targetObj, targetVirus:null, x, y, phase:"idle", respondingFairy:null});
  updateHappeningCounter();
  showHint(def.startMsg);
}

/* tap received: send the best available fairy running over.
   Priority: a fairy whose specialty exactly matches this happening,
   over a "fixes anything" special fairy — and among ties, whichever
   one is currently nearest, so it feels like someone nearby responds. */
function dispatchFairy(h){
  if(h.phase !== "idle") return; // already being handled
  const free = state.fairies.filter(f => !f.busy);
  const exact = free.filter(f => { const c = FAIRY_TYPES[f.type].canFix; return Array.isArray(c) && c.includes(h.typeId); });
  const specials = free.filter(f => FAIRY_TYPES[f.type].canFix === "all");
  const pool = exact.length ? exact : specials;
  if(pool.length === 0){
    showHint("妖精たちはほかのハプニング対応中みたい…少し待ってね");
    return;
  }
  pool.sort((a,b) => Math.hypot(a.x-h.x,a.y-h.y) - Math.hypot(b.x-h.x,b.y-h.y));
  const fairy = pool[0];
  fairy.busy = true;
  fairy.targetX = h.x; fairy.targetY = h.y;
  h.phase = "traveling";
  h.respondingFairy = fairy;
  showHint(`${FAIRY_TYPES[fairy.type].name}が駆けつけているよ！`);
}

const HAPPENING_SHRINK_MS = 3000; // ~3 seconds for the fairy to work its magic

function beginShrink(h){
  if(h.phase !== "traveling") return;
  h.phase = "shrinking";
  const def = HAPPENING_TYPES[h.typeId];
  if(def.objType === "flowerpatch"){
    // un-wilt the whole curated bed, and drop the glow off the main
    // flower — it stays fully visible throughout (no shrink-away
    // animation; it's a permanent decoration, not a hide/reveal marker
    // like rock/spiderweb/whirlpool)
    state.objects.filter(o => o.type === "flower" && o.curated).forEach(o => o.dom.classList.remove("happening-wilted"));
    removeAttentionSpark(h.targetObj.dom);
    h.targetObj.dom.classList.remove("happening-active");
  } else if(def.objType === "virus"){
    removeAttentionSpark(h.targetVirus.dom);
    h.targetVirus.dom.querySelector(".happening-shrink").classList.add("happening-shrinking");
  } else if(def.objType === "hotspring"){
    removeAttentionSpark(h.targetObj.dom);
    h.targetObj.dom.querySelector(".steam-group").classList.add("steam-shrinking");
  } else {
    removeAttentionSpark(h.targetObj.dom);
    h.targetObj.dom.querySelector(".happening-shrink").classList.add("happening-shrinking");
  }
  setTimeout(()=> finishResolve(h), HAPPENING_SHRINK_MS);
}

function finishResolve(h){
  const def = HAPPENING_TYPES[h.typeId];
  if(h.respondingFairy){
    h.respondingFairy.busy = false;
    h.respondingFairy.wanderAt = performance.now(); // pick a fresh wander target soon
  }
  if(def.objType === "flowerpatch"){
    // un-wilted and un-glowed already at the start of the shrink phase —
    // just needs to go back to its normal y-sorted spot in decorLayer
    sendBackFromHappeningFront(h.targetObj.dom);
  } else if(def.objType === "virus"){
    // fully removed by the antibiotic fairy — gone for good, not just cured-in-place
    h.targetVirus.dom.remove();
    state.viruses = state.viruses.filter(v => v !== h.targetVirus);
  } else if(def.objType === "hotspring"){
    h.targetObj.dom.classList.remove("onsen-steaming");
    const sg = h.targetObj.dom.querySelector(".steam-group");
    sg.classList.remove("steam-shrinking");
    sendBackFromHappeningFront(h.targetObj.dom);
  } else {
    const shrinkEl = h.targetObj.dom.querySelector(".happening-shrink");
    shrinkEl.classList.remove("happening-shrinking");
    h.targetObj.dom.classList.add("happening-hidden");
    h.targetObj.dom.classList.remove("happening-active");
    sendBackFromHappeningFront(h.targetObj.dom);
  }
  state.activeHappenings = state.activeHappenings.filter(a => a !== h);
  updateHappeningCounter();
  if(state.activeHappenings.length === 0){
    // that was the last one — everyone's all fixed up, time for a break
    enterNightMode();
  } else {
    showHint(def.fixMsg);
  }
}

/* ---- periodic scheduling, persisted so it survives closing the tab ---- */
function checkHappeningSchedule(){
  let last = 0;
  try{ last = +window.localStorage.getItem("kusuri_yousei_last_happening_at") || 0; }catch(e){ /* no record yet */ }
  const now = Date.now();
  if(now - last >= HAPPENING_INTERVAL_MS){
    triggerHappening();
    try{ window.localStorage.setItem("kusuri_yousei_last_happening_at", String(now)); }catch(e){}
  }
}
setTimeout(checkHappeningSchedule, 0);
setInterval(checkHappeningSchedule, 60 * 1000); // re-check every minute while the page is open

/* ============================================================
   6. SPAWN FAIRIES
   万能薬妖精3体は常設。それ以外は、服薬管理アプリでの記録に応じて
   ガチャ／確定入手で増えていく「所持妖精リスト」からのみ表示する。
   ============================================================ */
let youseiNextUid = 1;
function makeFairyRecord(type, pos){
  return { id: "y" + (youseiNextUid++), type, x: pos.x, y: pos.y };
}
function spawnFairyDom(f){
  const built = buildFairy(f);
  built.g.setAttribute("transform", `translate(${f.x},${f.y})`);
  fairiesLayer.appendChild(built.g);
  // cache these as plain numbers/strings ONCE instead of re-reading and
  // re-parsing them out of the DOM (getAttribute + regex/split) every
  // single animation frame in tick() below — same visual result, far
  // less string/DOM work per fairy per frame.
  const r = built.refs;
  r.legLBase = r.legL.getAttribute("transform") || "";
  r.legRBase = r.legR.getAttribute("transform") || "";
  r.headBaseX = parseFloat(r.headWrap.getAttribute("data-bx")) || 0;
  r.headBaseY = parseFloat(r.headWrap.getAttribute("data-by")) || 0;
  const now = performance.now();
  const live = {
    ...f, dom: built.g, refs: built.refs,
    targetX:f.x, targetY:f.y,
    walking:false, phase: Math.random()*10,
    blinkAt: now + 1500 + Math.random()*3000,
    wanderAt: now + 3000 + Math.random()*5000,
    dragging:false, downX:0, downY:0, moved:false,
    busy:false // true while dispatched to run over and fix a happening
  };
  state.fairies.push(live);
  // drag/tap handlers are attached here, at spawn time, so EVERY spawn path
  // gets them — before, they were attached once at startup to whichever
  // fairies existed then, so anything spawned afterwards (a fairy drawn from
  // the gacha mid-session, or one added by the debug button) couldn't be
  // dragged or tapped until the page was reloaded.
  wireFairyInteraction(live);
  return live;
}


/* ============================================================
   BOAT ARRIVAL — a new fairy rides a little boat down the river from
   its entrance to the middle of the flower field, then hops off.
   Used after the gacha reveal overlay closes, and by the debug
   "妖精を1体増やす" button. Arrivals are queued so only one boat sails
   at a time (the camera follows it, so two at once would fight).
   ============================================================ */
function makeBoatParts(){
  const back = el("g", {style:"pointer-events:none"});
  back.appendChild(el("ellipse", {cx:0, cy:20, rx:54, ry:8, fill:"#ffffff", opacity:"0.35"})); // ripple
  back.appendChild(el("rect", {x:-36, y:-54, width:3, height:46, fill:"#7a4d28"}));            // mast
  back.appendChild(el("path", {d:"M-33,-54 L-8,-46 L-33,-38 Z", fill:"#ff6b6b"}));             // pennant
  back.appendChild(el("path", {d:"M-50,-12 Q-44,20 -22,22 L22,22 Q44,20 50,-12 Q0,-2 -50,-12 Z", fill:"#a9713f", stroke:"#7a4d28", "stroke-width":3, "stroke-linejoin":"round"}));
  back.appendChild(el("ellipse", {cx:0, cy:-10, rx:45, ry:5, fill:"#6b4423"}));                // dark inside
  // front lip is a separate group drawn AFTER the fairy, so its legs look tucked inside the boat
  const front = el("g", {style:"pointer-events:none"});
  front.appendChild(el("path", {d:"M-48,-9 Q0,3 48,-9 L45,6 Q0,17 -45,6 Z", fill:"#c68a52", stroke:"#7a4d28", "stroke-width":2.5, "stroke-linejoin":"round"}));
  return {back, front};
}
// pans the camera toward (x,y) a bit each frame, unless the person is
// dragging/pinching the map themselves right now
function followCameraTo(x, y){
  if(panState || pinchState) return;
  const s = baseScale*camScale;
  const tx = -s*(x - (900 + SCENE_W/2)), ty = -s*(y - (250 + SCENE_H/2));
  camPanX += (tx-camPanX)*0.12;
  camPanY += (ty-camPanY)*0.12;
  applyCameraTransform();
}
/* ---- 到着のまとめ処理 ----
   船で降りた場所はいつも「大きな花のそば」なので、そのままにすると妖精が
   そこに固まってしまう。到着がひととおり終わったら（またはスキップしたら）
   画面を一度暗転させ、その間に新しい妖精を島のあちこちへランダムに配置してから
   明るく戻す。配置した位置は保存するので、開き直しても固まらない。 */
let arrivalPending = 0;       // 順番待ちを含む、これから到着する妖精の数
let arrivalSkip = false;      // スキップが押された
const arrivalBatch = [];      // 今回の到着で島に出た妖精
const arrivalFadeEl = document.getElementById("arrivalFade");
const arrivalSkipBtn = document.getElementById("arrivalSkipBtn");
const sleepMs = ms => new Promise(r => setTimeout(r, ms));

function landingBase(){
  return mainFlowerObj ? {x:mainFlowerObj.x, y:mainFlowerObj.y + 31} : {x:2700, y:3215};
}
// 船の降り場（大きな花のそば）と、障害物の上を避けて、島の中からランダムに選ぶ
function pickScatterPoint(){
  const lb = landingBase();
  for(let tries=0; tries<80; tries++){
    const p = randomIslandPoint();
    if(Math.hypot(p.x-lb.x, p.y-lb.y) < 140) continue;
    if(collidesWithObstacle(p.x, p.y, 24)) continue;
    return p;
  }
  return randomIslandPoint();
}
function placeFairyAt(live, p){
  live.x = p.x; live.y = p.y;
  live.targetX = p.x; live.targetY = p.y;
  live.wanderAt = performance.now() + 800 + Math.random()*2500;
  live.lastPos = null;
  live.dom.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
}
function saveFairyPositions(list){
  const st = loadYouseiSharedState();
  let changed = false;
  list.forEach(l => {
    const saved = st.fairies.find(r => r.id === l.id);
    if(saved){ saved.x = l.x; saved.y = l.y; changed = true; }
  });
  if(changed) saveYouseiSharedState(st);
}
async function finishArrivalBatch(){
  const batch = arrivalBatch.splice(0).filter(l => state.fairies.includes(l));
  arrivalSkipBtn.classList.remove("show");
  if(!batch.length){ arrivalSkip = false; return; }
  arrivalFadeEl.classList.add("show");
  await sleepMs(700);
  batch.forEach(l => { l.arriving = false; l.busy = false; placeFairyAt(l, pickScatterPoint()); });
  saveFairyPositions(batch);
  saveFairyPosMap();
  // 島全体が見える位置に戻して、散らばった様子が分かるようにする
  camScale = 1; camPanX = 0; camPanY = 0;
  applyCameraTransform();
  await sleepMs(250);
  arrivalFadeEl.classList.remove("show");
  arrivalSkip = false;
  showHint("みんな島のあちこちに散らばったよ");
}
arrivalSkipBtn.addEventListener("click", ()=>{
  arrivalSkip = true;
  arrivalSkipBtn.classList.remove("show");
});

function runBoatArrival(rec, onSpawn){
  return new Promise(resolve=>{
    const river = state.rivers[0];
    const pts = river ? river.points : [];
    const base = mainFlowerObj ? {x:mainFlowerObj.x, y:mainFlowerObj.y + 31} : {x:2700, y:3215}; // midway between the river's two passes around the flower
    let stopIdx = 0, best = Infinity;
    pts.forEach((p,i)=>{ const d = Math.hypot(p[0]-base.x, p[1]-base.y); if(d < best){ best = d; stopIdx = i; } });
    if(stopIdx < 1 || arrivalSkip){ // 川がない／スキップ済み — 船なしでそのまま現れる
      const live = spawnFairyDom({...rec, x:base.x, y:base.y});
      arrivalBatch.push(live);
      if(onSpawn) onSpawn(live);
      resolve(); return;
    }
    const cum = [0];
    for(let i=1;i<=stopIdx;i++) cum.push(cum[i-1] + Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]));
    const total = cum[stopIdx];
    const sailMs = clamp(total/620, 5, 11) * 1000;

    const live = spawnFairyDom({...rec, x:pts[0][0], y:pts[0][1]});
    live.arriving = true; live.busy = true;
    arrivalBatch.push(live);
    if(onSpawn) onSpawn(live);
    const {back, front} = makeBoatParts();
    fairiesLayer.insertBefore(back, live.dom);
    fairiesLayer.appendChild(front);
    const name = FAIRY_TYPES[rec.type].name;
    showHint(`${name}がふねでやってくるよ！`);

    const BS = 0.85;
    let facing = 1, seg = 0;
    const place = (x, y, tilt)=>{
      const tr = `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${tilt.toFixed(1)}) scale(${facing*BS},${BS})`;
      back.setAttribute("transform", tr); front.setAttribute("transform", tr);
    };
    const setFairy = (x, y)=>{
      live.x = x; live.y = y;
      live.dom.setAttribute("transform", `translate(${x.toFixed(1)},${y.toFixed(1)})`);
    };
    const abort = ()=>{ back.remove(); front.remove(); resolve(); }; // fairy was removed mid-trip
    // スキップ：船を消して、その場で到着扱いにする（場所はこのあと暗転中にばらける）
    const cutShort = ()=>{
      back.remove(); front.remove();
      setFairy(base.x, base.y);
      live.arriving = false; live.busy = false;
      live.targetX = live.x; live.targetY = live.y;
      resolve();
    };

    const t0 = performance.now();
    function sail(now){
      if(!state.fairies.includes(live)){ abort(); return; }
      if(arrivalSkip){ cutShort(); return; }
      const p = Math.min(1, (now-t0)/sailMs);
      const s = 0.5*p + 0.5*p*p*(3-2*p); // mostly steady, gentle start and stop
      const d = s*total;
      while(seg < stopIdx-1 && cum[seg+1] < d) seg++;
      const segLen = (cum[seg+1]-cum[seg]) || 1;
      const u = clamp((d-cum[seg])/segLen, 0, 1);
      const ax = pts[seg][0], ay = pts[seg][1], bx = pts[seg+1][0], by = pts[seg+1][1];
      const x = ax + (bx-ax)*u, y = ay + (by-ay)*u;
      const dxn = (bx-ax)/segLen;
      if(Math.abs(dxn) > 0.35) facing = dxn > 0 ? 1 : -1;
      const tt = now/1000;
      const bob = Math.sin(tt*4)*2.5;
      place(x, y+bob, Math.sin(tt*3)*2.5);
      setFairy(x, y+bob-26);
      followCameraTo(x, y);
      if(p < 1) requestAnimationFrame(sail); else disembark(x, y+bob);
    }
    function disembark(bx, by){
      showHint(`${name}がしまにおりるよ！`);
      const sx = bx, sy = by-26;
      const lx = base.x + (Math.random()*120-60), ly = base.y + (Math.random()*24-12);
      const h0 = performance.now(), HOP = 900;
      function hop(now){
        if(!state.fairies.includes(live)){ abort(); return; }
        if(arrivalSkip){ cutShort(); return; }
        const p = Math.min(1, (now-h0)/HOP);
        setFairy(sx + (lx-sx)*p, sy + (ly-sy)*p - Math.sin(p*Math.PI)*70);
        followCameraTo(live.x, live.y);
        if(p < 1) requestAnimationFrame(hop); else land();
      }
      requestAnimationFrame(hop);
    }
    function land(){
      live.arriving = false; live.busy = false;
      live.targetX = live.x; live.targetY = live.y;
      live.wanderAt = performance.now() + 1500;
      back.style.transition = front.style.transition = "opacity .8s ease";
      back.style.opacity = front.style.opacity = "0";
      setTimeout(()=>{ back.remove(); front.remove(); }, 900);
      resolve();
    }
    requestAnimationFrame(sail);
  });
}
let boatChain = Promise.resolve();
function enqueueBoatArrival(rec, onSpawn){
  arrivalPending++;
  if(!arrivalSkip) arrivalSkipBtn.classList.add("show");
  boatChain = boatChain
    .then(()=> runBoatArrival(rec, onSpawn))
    .catch(err => console.error(err))
    .then(()=>{
      arrivalPending--;
      if(arrivalPending === 0) finishArrivalBatch(); // 全員の到着が終わったら、暗転して場所をばらけさせる
    });
}

// NOTE: this used to filter for just special1/2/3, which meant every
// other entry in START_FAIRIES (including the 5 remedy fairies redesigned
// today) was defined but never actually spawned — a pre-existing bug,
// not something today's redesign broke. START_FAIRIES has been trimmed
// down to exactly what should always be on the island (see its own
// comment), so it's used directly now instead of being filtered.
const ALWAYS_ON_FAIRIES = START_FAIRIES;
// how many GACHA-earned fairies (not counting the 8 fixed special/remedy
// ones, which are unaffected) can be on the island's DOM at once. Past
// this, a fairy is still fully owned and safe in localStorage — it's just
// not drawn until called forth from the fairy album. See the album's own
// comment for the trade-off this is solving.
const DISPLAY_CAP = 30;
const youseiInitialState = loadYouseiSharedState();
// youseiNextUid (declared further below, used by makeFairyRecord) used to
// always restart at 1 every page load, with nothing syncing it against ids
// already sitting in storage — a fresh session could then hand out "y1"
// again even though a stored fairy already owned that id. Catching it up
// to one past the highest existing id here fixes that.
(function syncYouseiNextUid(st){
  let maxId = 0;
  st.fairies.forEach(f=>{
    const m = /^y(\d+)$/.exec(f.id);
    if(m) maxId = Math.max(maxId, parseInt(m[1], 10));
  });
  youseiNextUid = maxId + 1;
})(youseiInitialState);

  // then persist that decision so it doesn't get redecided every load
  let changed = false;

    }

})(youseiInitialState);

function buildYouseiRevealQueue(st){
  // 記録1件＝予約1件＝妖精1体。種類は受け取る直前（showNext）に決める
  const queue = [];
  st.pendingGuaranteed.forEach(key => {
    if(GROUP_REWARDS[key]) queue.push({kind:"guaranteed", token:key, type:null});
    else queue.push({kind:"guaranteed", baseType:key, type:null});
  });
  return queue;
}

function runYouseiRevealSequence(){
  const st = loadYouseiSharedState();
  const queue = buildYouseiRevealQueue(st);
  if(queue.length === 0) return;

  const overlay = document.getElementById("youseiGetOverlay");
  const stage = document.getElementById("youseiGetStage");
  const nameEl = document.getElementById("youseiGetName");
  const descEl = document.getElementById("youseiGetDesc");
  const kindEl = document.getElementById("youseiGetKind");
  const nextBtn = document.getElementById("youseiGetNextBtn");
  const countEl = document.getElementById("youseiGetCount");

  overlay.classList.add("show");
  let idx = 0;
  const arrivals = []; // fairies drawn this session that fit under the cap — they sail in by boat once the overlay closes
  const storedNoteEl = document.getElementById("youseiGetStoredNote");
  // running count of currently-displayed (non-hidden) gacha fairies, kept
  // up to date as this loop hands out new ones, so a big multi-draw
  // correctly starts hiding partway through instead of only checking once
  let displayedCount = st.fairies.filter(f => !f.hidden).length;

  function showNext(){
    if(idx >= queue.length){
      overlay.classList.remove("show");
      arrivals.forEach(r => enqueueBoatArrival(r));
      arrivals.length = 0;
      return;
    }
    const item = queue[idx];
    if(item.token) item.type = pickGroupRewardType(item.token, st.fairies);
    else item.type = pickSpecificLookType(item.baseType, st.fairies);
    const pos = (item.kind === "guaranteed" && SPECIALTY_START_POS[item.baseType || item.type])
      ? SPECIALTY_START_POS[item.baseType || item.type]
      : randomIslandPoint();
    const rec = makeFairyRecord(item.type, pos);
    // over the DISPLAY_CAP already? keep this one safely in the fairy
    // album instead of adding yet another fairy to an already-busy island —
    // still fully owned, just not drawn until called forth from there
    const overCap = displayedCount >= DISPLAY_CAP;
    rec.hidden = overCap;
    if(!overCap) displayedCount++;

    st.fairies.push(rec);
    if(item.kind === "guaranteed"){
      const gi = st.pendingGuaranteed.indexOf(item.token || item.baseType);
      if(gi !== -1) st.pendingGuaranteed.splice(gi, 1);
    } else {
      st.pendingDraws = Math.max(0, st.pendingDraws - 1);
    }
    saveYouseiSharedState(st); // 途中で閉じても取りこぼさないよう毎回保存
    if(!overCap) arrivals.push(rec); // (shown on the island later, by boat — see enqueueBoatArrival)

    const def = FAIRY_TYPES[item.type];
    stage.innerHTML = "";
    const built = buildFairy(rec);
    built.g.removeAttribute("filter");
    built.g.setAttribute("transform", "translate(90,120) scale(1.7)");
    const svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("viewBox", "0 0 180 210");
    svg.appendChild(built.g);
    stage.appendChild(svg);

    nameEl.textContent = def.name;
    descEl.textContent = def.desc;
    kindEl.textContent = item.kind === "guaranteed" ? "おくすりごほうび・かくてい入手！" : "きろくのごほうび・なかまがふえた！";
    countEl.textContent = `${idx + 1} / ${queue.length}`;
    storedNoteEl.classList.toggle("show", overCap);

    idx++;
  }

  nextBtn.onclick = showNext;
  showNext();
}

/* ============================================================
   7. ANIMATION LOOP
   ============================================================ */
// Three different update rates, chosen per how often each thing actually
// happens and how much it matters that it looks smooth:
//  - a fairy traveling to a happening: rare, short-lived, and very visible
//    (it's the thing your eye follows) → full 60fps, every frame.
//  - idle/wandering fairies (the common case, most fairies most of the
//    time): slow, gentle drifting → 20fps is plenty and cuts that DOM/string
//    work to roughly a third.
//  - viruses (slow background drift): 30fps, a middle ground.
// All movement math below is scaled by elapsed time (dt), so fairies/
// viruses move at the same real-world speed no matter which rate applies.
const FAIRY_WANDER_FPS = 20;
const FAIRY_WANDER_INTERVAL_MS = 1000 / FAIRY_WANDER_FPS;
const VIRUS_FPS = 30;
const VIRUS_INTERVAL_MS = 1000 / VIRUS_FPS;
const REF_FRAME_MS = 1000/60; // the original 0.07 / 0.012 lerp factors were tuned around ~60fps frames

// shared per-fairy limb/blink animation — called every frame for a fairy
// that's traveling to a happening (dt ≈ one frame), or once per wander
// tick for an idle one (dt ≈ 50ms) — the caller decides how often.
function animateFairyLimbs(f, dt, now){
  const species = FAIRY_TYPES[f.type].species;
  const {bodyWrap, legL, legR, headWrap, eyeL, eyeR, wingL, wingR, legLBase, legRBase, headBaseX, headBaseY} = f.refs;
  f.phase += dt*0.006;

  if(f.walking){
    f.legsWalking = true;
    const swing = Math.sin(f.phase*6) * 22;
    legL.setAttribute("transform", `${legLBase} rotate(${swing.toFixed(1)})`);
    legR.setAttribute("transform", `${legRBase} rotate(${(-swing).toFixed(1)})`);
    // bees fly, so their "walking" bob is really a flight bob — much more
    // pronounced than a ground animal's little walking bounce
    const bobAmp = species === "bee" ? 8 : 3;
    const bob = Math.abs(Math.sin(f.phase*6)) * bobAmp;
    // penguins rock side to side as they waddle — everyone else stays upright
    const waddle = species === "penguin" ? Math.sin(f.phase*6) * 9 : 0;
    bodyWrap.setAttribute("transform", `translate(0,${-bob.toFixed(1)}) rotate(${waddle.toFixed(1)})`);
    const headBob = Math.sin(f.phase*6 + 0.3) * 2;
    headWrap.setAttribute("transform", `translate(${headBaseX},${(headBaseY+headBob).toFixed(1)})`);
    if(wingL){
      // a bee's wings flap far faster than a bird's or a penguin's flippers
      const flapSpeed = species === "bee" ? 26 : 10;
      const flap = 18 + Math.sin(f.phase*flapSpeed)*10;
      wingL.setAttribute("transform", `translate(-15,-2) rotate(${-flap})`);
      wingR.setAttribute("transform", `translate(15,-2) rotate(${flap})`);
    }
  } else {
    if(f.legsWalking){ // 歩き終わった最初の1回だけ脚を戻す（毎回同じ値を書き込まない）
      legL.setAttribute("transform", legLBase);
      legR.setAttribute("transform", legRBase);
      f.legsWalking = false;
    }
    const breathe = Math.sin(f.phase*1.6) * 1.4;
    // bees keep a gentle hover-bob even at rest instead of standing still
    const idleBobAmp = species === "bee" ? 2.2 : 0.3;
    bodyWrap.setAttribute("transform", `translate(0,${(-Math.abs(breathe)*idleBobAmp).toFixed(2)}) scale(1, ${1+breathe*0.01})`);
    const idleHead = Math.sin(f.phase*1.3) * 1.2;
    headWrap.setAttribute("transform", `translate(${headBaseX},${(headBaseY+idleHead).toFixed(1)})`);
    if(wingL){
      const idleFlapSpeed = species === "bee" ? 9 : 1.4;
      const idleFlapAmp = species === "bee" ? 14 : 4;
      const idleFlap = Math.sin(f.phase*idleFlapSpeed) * idleFlapAmp;
      wingL.setAttribute("transform", `translate(-15,-2) rotate(${idleFlap})`);
      wingR.setAttribute("transform", `translate(15,-2) rotate(${-idleFlap})`);
    }
  }

  if(now > f.blinkAt){
    // reset to each fairy's own configured eye size, not a hardcoded
    // default — some species (penguin, mantis) draw bigger eyes on
    // purpose, and this used to snap them back to the generic 3.4 the
    // moment they blinked
    const openRy = f.refs.eyeOpenRy || 3.4;
    eyeL.setAttribute("ry", "0.4"); eyeR.setAttribute("ry", "0.4");
    setTimeout(()=>{ eyeL.setAttribute("ry", openRy); eyeR.setAttribute("ry", openRy); }, 90);
    f.blinkAt = now + 2000 + Math.random()*3500;
  }
}

let wanderTickN = 0;
// 画面外（とごく小さく映っているとき）の妖精は、見えないので描画の更新を省く。
// 妖精が増えても「見えている分」だけ DOM を触るようにするための判定。
let _viewW = 0, _viewH = 0;
function getViewCull(){
  const wrap = document.getElementById("stage-wrap");
  _viewW = wrap.clientWidth; _viewH = wrap.clientHeight;
  const sc = baseScale*camScale;
  const cx = 900 + SCENE_W/2, cy = 250 + SCENE_H/2;
  const m = 90*sc + 30;
  return {
    tiny: sc < 0.14,
    on(x,y){
      return Math.abs(sc*(x-cx)+camPanX) < _viewW/2 + m && Math.abs(sc*(y-cy)+camPanY) < _viewH/2 + m;
    }
  };
}
let lastFrameT = performance.now();
let lastWanderT = performance.now();
let lastVirusT = performance.now();
// guards against ever having two RAF chains running at once — several
// places (initial startup, visibilitychange, exitNightMode, and the
// startup night-resume check) may all want to (re)start the loop, and
// calling requestAnimationFrame(tick) from more than one of them around
// the same moment would silently double the update rate forever after.
let tickScheduled = false;
function scheduleTick(){
  if(tickScheduled) return;
  tickScheduled = true;
  requestAnimationFrame(tick);
}
function tick(now){
  tickScheduled = false; // this pending frame has now happened; anything below that wants another one must call scheduleTick() again
  // fully stop the RAF chain while the tab/app is backgrounded, instead of
  // just skipping work — on mobile this is the single biggest saver, since
  // a health app like this is very often left open in the background.
  if(document.hidden) return;
  // ...and likewise while the island is "asleep" for its night-mode break —
  // exitNightMode() restarts this loop with fresh timestamps when it ends.
  if(state.night) return;

  const frameDt = Math.min(120, now-lastFrameT); lastFrameT = now;
  const doWander = (now - lastWanderT) >= FAIRY_WANDER_INTERVAL_MS;
  const wanderDt = doWander ? Math.min(200, now-lastWanderT) : 0;
  if(doWander){ lastWanderT = now; wanderTickN++; }
  const doVirus = (now - lastVirusT) >= VIRUS_INTERVAL_MS;
  const virusDt = doVirus ? Math.min(150, now-lastVirusT) : 0;
  if(doVirus) lastVirusT = now;

  // frame-rate-independent movement: same "fraction of the remaining
  // distance covered per second" as the original 60fps-tuned constants,
  // just applied in fewer/larger (wander, virus) or the same (busy) steps.
  const fairyMoveBusy = Math.min(1, 0.07 * (frameDt/REF_FRAME_MS));
  const fairyMoveWander = Math.min(1, 0.07 * (wanderDt/REF_FRAME_MS));
  const virusMove = Math.min(1, 0.012 * (virusDt/REF_FRAME_MS));

  const cull = doWander ? getViewCull() : null;
  state.fairies.forEach((f, fi)=>{
    if(f.arriving) return; // still riding the arrival boat — runBoatArrival positions it itself
    if(f.busy){
      // dispatched to a happening: every frame, for a smooth, easy-to-follow run
      f.lastPos = null; // 他の経路でDOMを書き換えるので、位置キャッシュを無効化
      if(!f.dragging){
        const dx = f.targetX - f.x, dy = f.targetY - f.y;
        const dist = Math.hypot(dx,dy);
        f.walking = dist > 3;
        if(f.walking){ f.x += dx*fairyMoveBusy; f.y += dy*fairyMoveBusy; }
        f.dom.setAttribute("transform", `translate(${f.x.toFixed(1)},${f.y.toFixed(1)})`);
      }
      animateFairyLimbs(f, frameDt, now);
    } else {
      if(!doWander) return; // idle fairies only get touched at the slower wander rate
      if(!f.dragging){
        if(now > f.wanderAt){
          for(let tries=0; tries<5; tries++){
            const ang = Math.random()*Math.PI*2;
            const dist = 35 + Math.random()*55;
            const nx = f.x + Math.cos(ang)*dist;
            const ny = f.y + Math.sin(ang)*dist*0.6;
            if(insideIsland(nx,ny) && !pathBlocked(f.x,f.y,nx,ny)){
              f.targetX = nx; f.targetY = ny;
              break;
            }
          }
          f.wanderAt = now + 4000 + Math.random()*5000;
        }
        const dx = f.targetX - f.x, dy = f.targetY - f.y;
        const dist = Math.hypot(dx,dy);
        f.walking = dist > 3;
        if(f.walking){
          f.x += dx*fairyMoveWander;
          f.y += dy*fairyMoveWander;
        }
        // 位置が変わったときだけ、かつ画面に見えているときだけ DOM を更新
        // （見えない間に動いた分は、画面に戻った最初の tick でまとめて反映される）
        if(cull.on(f.x, f.y)){
          const pos = `translate(${f.x.toFixed(1)},${f.y.toFixed(1)})`;
          if(f.lastPos !== pos){ f.dom.setAttribute("transform", pos); f.lastPos = pos; }
        }
      }
      // 画面外・極小表示の妖精は動きの描画を省略。立ち止まっている妖精の呼吸・
      // まばたきは約10fpsで十分なので、妖精ごとに交互のtickで更新して負荷も分散。
      f.idleDt = (f.idleDt||0) + wanderDt;
      if(!cull.tiny && cull.on(f.x, f.y) && (f.walking || ((wanderTickN + fi) & 1))){
        animateFairyLimbs(f, f.idleDt, now); f.idleDt = 0;
      } else if(f.idleDt > 1000){ f.idleDt = 1000; }
    }
  });

  // once a dispatched fairy reaches its happening, start the ~3s "shrinking it down" phase.
  // virus happenings track a moving target, so keep their coordinates (and
  // whichever fairy is chasing one) synced to the virus's live position first.
  // (cheap — state.activeHappenings is always a small list — so this runs every frame.)
  state.activeHappenings.forEach(h=>{
    if(h.targetVirus){
      h.x = h.targetVirus.x; h.y = h.targetVirus.y;
      if(h.phase === "traveling" && h.respondingFairy){
        h.respondingFairy.targetX = h.x;
        h.respondingFairy.targetY = h.y;
      }
    }
    if(h.phase === "traveling" && h.respondingFairy){
      const f = h.respondingFairy;
      if(Math.hypot(f.x-h.x, f.y-h.y) < 40) beginShrink(h);
    }
  });

  // viruses drift slowly around the whole body, forever, on their own —
  // each one is always its own tappable happening (see spawnVirus)
  if(doVirus){
    state.viruses.forEach(v=>{
      v.phase += virusDt*0.003;
      if(now > v.wanderAt){
        const ang = Math.random()*Math.PI*2;
        const dist = 60 + Math.random()*90;
        const nx = v.x + Math.cos(ang)*dist;
        const ny = v.y + Math.sin(ang)*dist;
        if(insideIsland(nx,ny)){ v.targetX = nx; v.targetY = ny; }
        v.wanderAt = now + 5000 + Math.random()*6000; // slow, lazy direction changes
      }
      const dx = v.targetX - v.x, dy = v.targetY - v.y;
      if(Math.hypot(dx,dy) > 2){
        v.x += dx*virusMove;
        v.y += dy*virusMove;
      }
      const wobble = Math.sin(v.phase*2.4) * 6;
      v.dom.setAttribute("transform", `translate(${v.x.toFixed(1)},${v.y.toFixed(1)}) rotate(${wobble.toFixed(1)})`);
    });
  }

  scheduleTick();
}
// pick up a night that was already counting down before this page load
// (see resumeNightModeIfNeeded's own comment), then start the loop.
resumeNightModeIfNeeded();
scheduleTick();
// resume the loop (and avoid one giant dt jump) when the tab/app comes
// back to the foreground, since tick() above returns immediately while hidden
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden){
    lastFrameT = performance.now();
    lastWanderT = lastFrameT;
    lastVirusT = lastFrameT;
    scheduleTick();
  }
});

   8. INTERACTION — hint helper
   ============================================================ */
const hint = document.getElementById("hintText");

function showHint(text){
  hint.textContent = text;
  hint.classList.add("show");
  clearTimeout(showHint._t);
  showHint._t = setTimeout(()=>hint.classList.remove("show"), 1800);
}
/* 画面上の位置（clientX/Y）→ 島の座標。
   DOMの図形情報（getScreenCTM / getBoundingClientRect）には頼らず、アプリ自身が持っている
   カメラの状態（拡大率 baseScale*camScale と移動量 camPanX/Y）から計算する。
   iPhone(Safari/WebKit)では、CSS transform で拡大縮小している <svg> に対して
   getScreenCTM() は親のtransformを無視し、getBoundingClientRect() も
   overflow:visible の内容を含んだ大きさを返すことがあり、ズームするほど座標がずれて
   妖精を動かせない・ものを置けない原因になっていた。
   カメラの配置は followCameraTo() と同じ式：
   島の中心 (900+SCENE_W/2, 250+SCENE_H/2) が、表示エリアの中心 + (camPanX, camPanY) に来る。 */
function svgPoint(evt){
  const wr = document.getElementById("stage-wrap").getBoundingClientRect(); // 変形していない固定の枠
  const s = baseScale * camScale;
  return {
    x: (900 + SCENE_W/2) + (evt.clientX - (wr.left + wr.width/2)  - camPanX) / s,
    y: (250 + SCENE_H/2) + (evt.clientY - (wr.top  + wr.height/2) - camPanY) / s
  };
}

/* ---- fairy: selected only while actively dragging; drop = move ---- */
let infoPanelFairy = null; // whichever fairy #info-panel is currently showing, if any — used by the "さようなら" button
// removes the DOM/live-state side of a fairy — shared by removeFairy
// (says goodbye forever) and putAwayFairy (keeps it, just off-island)
function detachFairyFromIsland(f){
  f.dom.remove();
  const idx = state.fairies.indexOf(f);
  if(idx !== -1) state.fairies.splice(idx, 1);
  // if this fairy was mid-dispatch to fix something, free that happening
  // back up (a tap will send a different fairy) instead of leaving it
  // stuck forever waiting on a fairy that's no longer on the island
  state.activeHappenings.forEach(h=>{
    if(h.respondingFairy === f){
      h.respondingFairy = null;
      h.phase = "idle";
    }
  });
}
// sends a fairy back into the fairy album (see DISPLAY_CAP) — unlike
// removeFairy, the record itself is kept, just flagged hidden, so it can
// be called forth again later exactly as it was
function putAwayFairy(f){
  detachFairyFromIsland(f);
  if(f.id && f.id.startsWith("y")){
    const st = loadYouseiSharedState();
    const rec = st.fairies.find(r => r.id === f.id);
    if(rec){ rec.hidden = true; saveYouseiSharedState(st); }
  }
  renderFairyAlbum();
}
// brings one fairy of `type` out of the album and onto the island, by
// boat, exactly like a freshly-drawn gacha fairy would arrive
function callForthFairy(type){
  const st = loadYouseiSharedState();
  const shownNow = st.fairies.filter(f => !f.hidden).length;
  if(shownNow >= DISPLAY_CAP){
    showHint(`まず島の誰かをしまってね（今 ${shownNow}/${DISPLAY_CAP}）`);
    return;
  }
  const rec = st.fairies.find(f => f.type === type && f.hidden);
  if(!rec) return;
  rec.hidden = false;
  saveYouseiSharedState(st);
  enqueueBoatArrival(rec);
  renderFairyAlbum();
}
// a small standalone render of one fairy type, for the album list — same
// technique the gacha reveal card already uses (build the real character
// via buildFairy, drop it in its own little <svg>), just serialized to a
// string via outerHTML so it can sit in the innerHTML template below
// alongside everything else, instead of a plain colour swatch.
function miniFairySvg(type){
  const built = buildFairy({id:"preview_"+type, type});
  built.g.removeAttribute("filter");
  built.g.setAttribute("transform", "translate(90,128) scale(1.3)");
  const svg = document.createElementNS(SVGNS, "svg");
  svg.setAttribute("viewBox", "0 0 180 200");
  svg.setAttribute("class", "album-icon-svg");
  svg.appendChild(built.g);
  return svg.outerHTML;
}
function renderFairyAlbum(){
  const st = loadYouseiSharedState();
  const listEl = document.getElementById("fairyAlbumList");

function wireFairyInteraction(f){
  /* ドラッグ中の動きは、妖精の要素ではなく document 全体で受け取る。
     iPhone(Safari)では setPointerCapture が SVG 要素で効かないことがあり、
     ズームして妖精が小さく映っているときは、少し動かしただけで指が妖精の上から外れて
     動きが届かなくなる（かろうじてしか動かない）原因になっていた。
     document で受ければ、指がどこに移っても、同じ指(pointerId)の動きを最後まで追える。 */
  const onMove = (e)=>{
    if(!f.dragging || e.pointerId !== f.dragPointerId) return;
    const p = svgPoint(e);
    if(Math.hypot(p.x-f.downX, p.y-f.downY) > 5) f.moved = true;
    if(!insideIsland(p.x,p.y)) return;
    f.x = p.x; f.y = p.y;
    f.targetX = p.x; f.targetY = p.y;
    f.dom.setAttribute("transform", `translate(${p.x.toFixed(1)},${p.y.toFixed(1)})`);
    f.lastPos = null;
  };
  const release = (e)=>{
    if(e.pointerId !== f.dragPointerId) return; // 別の指（ピンチの2本目など）の離しでは終わらない
    document.removeEventListener("pointermove", onMove);
    document.removeEventListener("pointerup", release);
    document.removeEventListener("pointercancel", release);
    if(!f.dragging) return; // ピンチなどで、すでに取り消されている
    try{ f.dom.releasePointerCapture(e.pointerId); }catch(err){}
    f.dragging = false;
    f.dom.classList.remove("dragging","selected");
    f.targetX = f.x; f.targetY = f.y;
    f.wanderAt = performance.now() + 4000 + Math.random()*4000;
    if(f.moved) saveFairyPosMap(); // 動かした位置を覚えておく
    if(!f.moved){
      const t = FAIRY_TYPES[f.type];
      infoPanelFairy = f;
      document.getElementById("infoName").textContent = t.name;
      document.getElementById("infoDesc").textContent = t.desc;
      // the "put away" button only makes sense for fairies that pile up
      // over time (earned through medication records) — the small fixed
      // cast (special/remedy fairies) always stays on the island, so this
      // stays off for those (see DISPLAY_CAP's own comment on why)
      document.getElementById("infoFairyStoreBtn").classList.toggle("show", !!(f.id && f.id.startsWith("y")));
      document.getElementById("info-panel").classList.add("show");
    }
  };
  f.dom.addEventListener("pointerdown", (e)=>{
    if(state.placingType || f.arriving) return;
    e.stopPropagation();
    f.dragging = true;
    f.moved = false;
    f.dragPointerId = e.pointerId;
    const p = svgPoint(e);
    f.downX = p.x; f.downY = p.y;
    f.dom.classList.add("dragging","selected");
    try{ f.dom.setPointerCapture(e.pointerId); }catch(err){}
    document.addEventListener("pointermove", onMove);
    document.addEventListener("pointerup", release);
    document.addEventListener("pointercancel", release);
  });
}

  infoPanelFairy = null;

/* ---- placement: drag on island to size & drop;
   eraser mode taps to remove; move mode drags them elsewhere; empty
   drag pans the view ---- */
let placeDrag = null;
let panState = null;
let pathDraft = null;
let moveDrag = null;
const DEFAULT_SCALE = { tree:2, flower:2, grass:2, house:2, fence:2, fenceV:2 };
const PLACEMENT_MAX_SCALE = { hotspring:10, tree:6.4, flower:6.4, grass:6.4, house:6.4, fence:6.4, fenceV:6.4 }; // hotspring needs to cover ~1/3 of the head; the rest doubled per request

/* ---- two-finger pinch-to-zoom (tablets/touchscreens) ----
   The single-finger pan below already works via Pointer Events, which
   unify mouse and touch, but each finger of a pinch gesture fires its own
   independent pointerdown/move/up — there's no built-in "pinch" event —
   so a second touch needs to be detected and handled separately here,
   taking over from (and cancelling) whatever the first finger started. */
const activeTouches = new Map(); // pointerId -> {x, y} in client coordinates, touch pointers only
let pinchState = null; // {pointerIds:[a,b], startDist, startScale, startPanX, startPanY, startMidClientX, startMidClientY}

function touchPoints(ids){
  return ids.map(id => activeTouches.get(id));
}
function cancelOtherGestures(e){
  // a second finger just landed — whatever the first finger was doing
  // (panning, placing, moving an object, drawing a path) is no longer
  // what the person wants, so stop it cleanly before starting the pinch
  if(panState) endPan(e);
  if(moveDrag) moveDrag = null;
  if(placeDrag){ placeDrag.ghost.remove(); placeDrag = null; }
  if(pathDraft){ pathDraft.dom.remove(); pathDraft = null; }
}

/* 2本指ズームの開始。
   指が妖精やオブジェクトの上に乗っていても反応するよう、タッチの記録とピンチの開始は
   「キャプチャ段階」（対象要素のハンドラより先）で行う。妖精のpointerdownは
   stopPropagation() するので、バブリング段階だと、妖精に触れた指が記録されず、
   2本目の指を置いてもズームできなかった。 */
function startPinch(e){
  cancelOtherGestures(e);
  // 1本目の指で始まっていた妖精のドラッグは取り消す（ズームの邪魔をしない）
  state.fairies.forEach(f => {
    if(f.dragging){
      f.dragging = false; f.moved = false;
      f.dom.classList.remove("dragging","selected");
      f.targetX = f.x; f.targetY = f.y;
    }
  });
  const ids = [...activeTouches.keys()];
  const [a,b] = touchPoints(ids);
  pinchState = {
    pointerIds: ids,
    startDist: Math.hypot(a.x-b.x, a.y-b.y) || 1,
    startScale: camScale,
    startPanX: camPanX,
    startPanY: camPanY,
    startMidClientX: (a.x+b.x)/2,
    startMidClientY: (a.y+b.y)/2
  };
}
scene.addEventListener("pointerdown", (e)=>{
  if(e.pointerType !== "touch") return;
  activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if(activeTouches.size === 2 && !pinchState){
    startPinch(e);
    e.stopPropagation(); // 2本目の指は、タップ/ドラッグとしては扱わない
  } else if(activeTouches.size > 2){
    e.stopPropagation(); // 3本目以降は無視
  }
}, true);

scene.addEventListener("pointerdown", (e)=>{
  if(e.pointerType === "touch"){
    activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }

  if(e.target.closest(".fairy-group")) return;
  const p = svgPoint(e);

  if(state.placingType === "eraser"){
    const pathEl = e.target.closest(".placed-path");
    if(pathEl){
      erasePath(pathEl);
      deselectTool();
      return;
    }
    const objEl = e.target.closest(".placed-obj");
    if(objEl){
      eraseObject(objEl);
      deselectTool();
    }
    return;
  }

  if(state.placingType === "move"){
    const objEl = e.target.closest(".placed-obj");
    if(!objEl){ return; }
    const rec = state.objects.find(o => o.dom === objEl);
    if(!rec) return;
    moveDrag = {rec, offX:p.x-rec.x, offY:p.y-rec.y, moved:false};
    return;
  }

  if(state.placingType === "path"){
    if(!insideIsland(p.x,p.y)){ showHint("島の中に描いてね"); return; }
    pathDraft = {points:[[p.x,p.y]]};
    const g = el("g", {class:"placed-path ghost-preview", opacity:"0.7"});
    g.appendChild(el("path", {d:pointsToPathD(pathDraft.points), fill:"none", stroke:"#dfc38c", "stroke-width":26, "stroke-linecap":"round", "stroke-linejoin":"round"}));
    scene.appendChild(g);
    pathDraft.dom = g;
    return;
  }

  if(state.placingType){
    if(!insideIsland(p.x,p.y)){ showHint("島の中に置いてね"); return; }
    const ds = DEFAULT_SCALE[state.placingType] || 1;
    const ghost = OBJECT_TYPES[state.placingType].build();
    ghost.classList.add("ghost-preview");
    ghost.setAttribute("opacity","0.55");
    ghost.setAttribute("transform", `translate(${p.x},${p.y}) scale(${ds},${ds})`);
    scene.appendChild(ghost);
    placeDrag = {type:state.placingType, startX:p.x, startY:p.y, ghost, sx:ds, sy:ds};
    return;
  }

  // nothing to place/erase -> drag pans the view
  panState = {startClientX:e.clientX, startClientY:e.clientY, startPanX:camPanX, startPanY:camPanY};
  cameraEl.classList.add("panning");
  try{ scene.setPointerCapture(e.pointerId); }catch(err){}
});
scene.addEventListener("pointermove", (e)=>{
  if(e.pointerType === "touch" && activeTouches.has(e.pointerId)){
    activeTouches.set(e.pointerId, {x:e.clientX, y:e.clientY});
  }
  if(pinchState){
    if(!pinchState.pointerIds.includes(e.pointerId)) return; // ignore a spectating third finger, if any
    const [a,b] = touchPoints(pinchState.pointerIds);
    if(!a || !b) return; // one of the two has already lifted — pointerup will close pinchState out shortly
    const dist = Math.hypot(a.x-b.x, a.y-b.y);
    const midClientX = (a.x+b.x)/2, midClientY = (a.y+b.y)/2;
    // ピンチでは、+/-ボタンの範囲より広く、島全体が見える倍率(1)まで縮小できる
    camScale = clamp(pinchState.startScale * (dist/pinchState.startDist), 1, ZOOM_MAX);
    // 指の間にあった島の一点が、指の間に残り続けるようにズームする
    // （画面の中心を基準に、パンの量を倍率の変化ぶんだけ補正する）
    const wr = document.getElementById("stage-wrap").getBoundingClientRect();
    const cx = wr.left + wr.width/2, cy = wr.top + wr.height/2;
    const k = camScale / pinchState.startScale;
    camPanX = (midClientX - cx) - k*(pinchState.startMidClientX - cx - pinchState.startPanX);
    camPanY = (midClientY - cy) - k*(pinchState.startMidClientY - cy - pinchState.startPanY);
    applyCameraTransform();
    return;
  }
  if(moveDrag){
    const p = svgPoint(e);
    const nx = p.x - moveDrag.offX, ny = p.y - moveDrag.offY;
    moveDrag.moved = true;
    moveDrag.rec.dom.setAttribute("transform", `translate(${nx},${ny}) scale(${moveDrag.rec.sx},${moveDrag.rec.sy})`);
    return;
  }
  if(pathDraft){
    const p = svgPoint(e);
    const last = pathDraft.points[pathDraft.points.length-1];
    if(Math.hypot(p.x-last[0], p.y-last[1]) > 14){
      pathDraft.points.push([p.x,p.y]);
      pathDraft.dom.firstChild.setAttribute("d", pointsToPathD(pathDraft.points));
    }
    return;
  }
  if(placeDrag){
    const p = svgPoint(e);
    const dx = p.x - placeDrag.startX, dy = p.y - placeDrag.startY;
    const defaultScale = DEFAULT_SCALE[placeDrag.type] || 1;
    const maxScale = PLACEMENT_MAX_SCALE[placeDrag.type] || 3.2;
    // the size at the moment of the initial tap (defaultScale) is now the
    // floor — dragging can only make it bigger, never smaller/thinner
    // than what you started with, per request
    const sx = clamp(Math.abs(dx)/40, defaultScale, maxScale);
    const sy = clamp(Math.abs(dy)/40, defaultScale, maxScale);
    placeDrag.sx = sx; placeDrag.sy = sy;
    placeDrag.ghost.setAttribute("transform", `translate(${placeDrag.startX},${placeDrag.startY}) scale(${sx},${sy})`);
    return;
  }
  if(panState){
    camPanX = panState.startPanX + (e.clientX - panState.startClientX);
    camPanY = panState.startPanY + (e.clientY - panState.startClientY);
    applyCameraTransform();
  }
});
function finishPath(){
  if(!pathDraft) return;
  pathDraft.dom.remove();
  if(pathDraft.points.length >= 2){
    const rec = {id: state.nextPathId++, points: pathDraft.points};
    state.paths.push(rec);
    renderPathTrail(rec);
    showHint("道を置いたよ");
  }
  pathDraft = null;
  deselectTool();
}
function finishPlacement(){
  if(!placeDrag) return;
  const {type, startX, startY, sx, sy, ghost} = placeDrag;
  ghost.remove();
  placeObject(type, startX, startY, sx, sy);
  showHint(OBJECT_TYPES[type].label + "を置いたよ");
  placeDrag = null;
  deselectTool();
}
function finishMove(){
  if(!moveDrag) return;
  const {rec, offX, offY, moved} = moveDrag;
  if(moved){
    // final position was already applied live in pointermove; just sync the record
    const t = rec.dom.getAttribute("transform").match(/translate\(([\-\d.]+),([\-\d.]+)\)/);
    if(t){ rec.x = +t[1]; rec.y = +t[2]; }
    invalidateObstacleGrid();
    reorderDecorLayer();
    showHint("うごかしたよ");
  }
  moveDrag = null;
  deselectTool();
}
function endPan(e){
  if(!panState) return;
  cameraEl.classList.remove("panning");
  try{ scene.releasePointerCapture(e.pointerId); }catch(err){}
  panState = null;
}
function releaseTouch(e){
  if(e.pointerType !== "touch") return;
  activeTouches.delete(e.pointerId);
  if(pinchState && pinchState.pointerIds.includes(e.pointerId)){
    pinchState = null;
    // don't try to resume a single-finger pan from whichever finger (if
    // any) is still down — its pointerdown already happened back when
    // the pinch started, so there's no fresh drag-start reference point.
    // The person just lifts and touches again to keep panning, which is
    // the natural gesture anyway.
  }
}
scene.addEventListener("pointerup", (e)=>{ finishMove(); finishPath(); finishPlacement(); endPan(e); releaseTouch(e); });
scene.addEventListener("pointerleave", (e)=>{
  if(pathDraft){ pathDraft.dom.remove(); pathDraft = null; }
  if(placeDrag){ placeDrag.ghost.remove(); placeDrag = null; }
  moveDrag = null;
  releaseTouch(e);
});
scene.addEventListener("pointercancel", (e)=>{
  if(pathDraft){ pathDraft.dom.remove(); pathDraft = null; }
  if(placeDrag){ placeDrag.ghost.remove(); placeDrag = null; }
  moveDrag = null;
  endPan(e);
  releaseTouch(e);
});

    state.placingType = key;
    document.body.classList.add("editing");
    if(key === "eraser"){
      document.body.classList.add("erase-mode");
      showHint("消したいものをタップしてね");
    } else if(key === "move"){
      document.body.classList.add("erase-mode"); // reuse: makes placed-obj tappable/draggable outside edit mode
      showHint("うごかしたいものをつまんで動かしてね");
    } else if(key === "path"){
      showHint("島の上をなぞって道を描いてね");
    } else {
      showHint(info.label + "を島にドラッグして置いてね");
    }
  });
  palette.appendChild(item);
});

/* ============================================================
   10. CAMERA FIT
   ============================================================ */
const ZOOM_STEP = 1.25;
// the old range was 0.35–6.25 with camScale=1 being "fit the whole island
// on screen". History: loosened the zoomed-out floor by one step (5→4
// presses' worth) twice now since it kept feeling one notch too tight;
// the zoomed-in ceiling has come down two steps from its old "double"
// value since it wasn't needed that deep.
const ZOOM_MIN = Math.pow(ZOOM_STEP, 4); // ≈2.44
const ZOOM_MAX = (6.25 * 2) / Math.pow(ZOOM_STEP, 2); // ≈8.0
let baseScale = 1, camScale = ZOOM_MIN, camPanX = 0, camPanY = 0;
const cameraEl = document.getElementById("camera");
// the island's body (head/torso/arms/legs) only ever spans roughly
// x:[1258,4142] y:[596,5303] in scene units — the old canvas (8400×8900)
// was mostly empty sea far outside that, which is exactly what made the
// map feel oversized. This is now cropped to a snug portrait box around
// the body instead, with a comfortable margin. Must match the <svg>
// width/height/viewBox above.
const SCENE_W = 3600, SCENE_H = 5400;
function clampPan(){
  const wrap = document.getElementById("stage-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  const scale = baseScale * camScale;
  const maxX = Math.max(0, (SCENE_W*scale - w) / 2);
  const maxY = Math.max(0, (SCENE_H*scale - h) / 2);
  camPanX = clamp(camPanX, -maxX, maxX);
  camPanY = clamp(camPanY, -maxY, maxY);
}
function applyCameraTransform(){
  clampPan();
  cameraEl.style.transform = `translate(-50%,-50%) translate(${camPanX}px,${camPanY}px) scale(${baseScale*camScale})`;
}
function fitCamera(){
  const wrap = document.getElementById("stage-wrap");
  const w = wrap.clientWidth, h = wrap.clientHeight;
  baseScale = Math.min(w/SCENE_W, h/SCENE_H, 1.05);
  applyCameraTransform();
}
window.addEventListener("resize", fitCamera);
fitCamera();

document.getElementById("zoomInBtn").addEventListener("click", ()=>{
  camScale = clamp(camScale*ZOOM_STEP, ZOOM_MIN, ZOOM_MAX);
  applyCameraTransform();
});
document.getElementById("zoomOutBtn").addEventListener("click", ()=>{
  camScale = clamp(camScale/ZOOM_STEP, ZOOM_MIN, ZOOM_MAX);
  applyCameraTransform();
});
// island-overview button: intentionally bypasses ZOOM_MIN — camScale=1 is
// "fit the whole island in the viewport" (see fitCamera), independent of
// the closer-in range the +/- buttons now work within.
document.getElementById("zoomResetBtn").addEventListener("click", ()=>{
  camScale = 1; camPanX = 0; camPanY = 0;
  applyCameraTransform();
  showHint("島全体を表示したよ");
});

showHint("妖精をドラッグして動かしてみよう");

})();
</script>
