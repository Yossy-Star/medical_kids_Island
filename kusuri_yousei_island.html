<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>薬の妖精の島</title>
<style>
  :root{
    --sky-top:#eaf7ee;
    --sky-bottom:#dff3f5;
    --sand:#f3dfa8;
    --sand-shadow:#e2c988;
    --grass:#8fc93a;
    --grass-dark:#6fae2c;
    --grass-deep:#5a9722;
    --water:#7fd8e8;
    --water-deep:#59c2d6;
    --ink:#4a3c2a;
    --panel:#fffaf0;
    --panel-line:#e9dcc0;
    --coral:#ff8fa3;
    --coral-deep:#ef7089;
    --sun:#ffcf6b;
    --sun-deep:#f2ac2e;
    --leaf:#4f9d3d;
    font-family:"Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Yu Gothic",sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--sky-bottom);}

  #app{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    flex-direction:column;
    background:linear-gradient(180deg,var(--sky-top) 0%, var(--sky-bottom) 100%);
  }

  header{
    flex:0 0 auto;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    z-index:20;
    position:relative;
  }
  .header-right{ display:flex; gap:8px; align-items:center; }
  .top-btn{
    border:none;
    background:var(--panel);
    color:var(--ink);
    font-size:13px;
    padding:8px 14px;
    border-radius:999px;
    box-shadow:0 3px 0 var(--panel-line);
    cursor:pointer;
    font-weight:700;
    white-space:nowrap;
  }
  .top-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--panel-line); }
  .top-btn.on{ background:var(--coral); color:#fff; box-shadow:0 3px 0 var(--coral-deep); }

  #menuWrap{ position:relative; }
  #menuDropdown{
    position:absolute;
    top:calc(100% + 8px);
    right:0;
    background:var(--panel);
    border-radius:16px;
    box-shadow:0 6px 0 var(--panel-line), 0 10px 24px #0000001a;
    padding:8px;
    min-width:170px;
    display:none;
    flex-direction:column;
    gap:4px;
  }
  #menuDropdown.show{ display:flex; }
  .menu-item{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 12px;
    border-radius:12px;
    font-size:13px;
    font-weight:700;
    color:var(--ink);
    cursor:pointer;
  }
  .menu-item:hover, .menu-item:active{ background:#f6ecd6; }
  .menu-item.on{ background:#fff0f3; color:var(--coral-deep); }
  .menu-note{
    font-size:10px;
    color:#a99a7c;
    padding:2px 12px 4px;
  }

  #stage-wrap{
    flex:1 1 auto;
    position:relative;
    overflow:hidden;
    touch-action:none;
  }
  #zoomControls{
    position:absolute;
    right:14px;
    bottom:14px;
    z-index:10;
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .zoom-btn{
    width:44px; height:44px;
    border:none;
    border-radius:50%;
    background:var(--panel);
    box-shadow:0 3px 0 var(--panel-line), 0 6px 14px #0000001a;
    font-size:18px;
    font-weight:800;
    color:var(--ink);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .zoom-btn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--panel-line); }

  #camera{
    position:absolute;
    left:50%; top:50%;
    transition:none;
    cursor:grab;
  }
  #camera.panning{ cursor:grabbing; }
  svg#scene{
    display:block;
    overflow:visible;
  }

  .balloon-sway{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    /* steps(96) ≈ 30 updates/sec over this 3.2s loop, instead of a
       continuous (~60fps) interpolation — half the paint work for a sway
       nobody needs to see at full smoothness */
    animation: balloonSway 3.2s steps(96, end) infinite;
  }
  @keyframes balloonSway{
    0%,100% { transform: rotate(-6deg); }
    50%     { transform: rotate(6deg); }
  }

  /* flowers hold a fixed pose now — no continuous per-flower animation
     running at all (there can be ~60 of them on screen at once) */
  .flower-sway{
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  /* grass, like the flowers, now holds a still pose — no continuously
     running per-tuft animation */
  .grass-sway{
    transform-box: fill-box;
    transform-origin: 50% 100%;
  }

  .whirl-spin{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: whirlSpin 1.6s linear infinite;
  }
  @keyframes whirlSpin{
    100% { transform: rotate(360deg); }
  }
  .whirl-ripple{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    animation: whirlRipple 2.4s ease-in-out infinite;
  }
  @keyframes whirlRipple{
    0%,100% { transform: scale(0.94); opacity: 0.5; }
    50%     { transform: scale(1.06); opacity: 0.2; }
  }

  .virus-bob{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    /* steps() to match the ~30fps rate the JS-driven drift/rotation also
       uses now, instead of a continuous interpolation */
    animation: virusBob 2.1s steps(63, end) infinite;
  }
  @keyframes virusBob{
    0%,100% { transform: translateY(-2px) rotate(-4deg); }
    50%     { transform: translateY(2px) rotate(4deg); }
  }

  .steam-rise{
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: steamRise 2.6s ease-in infinite;
  }
  @keyframes steamRise{
    0%   { transform: translateY(0) scale(1);   opacity: 0; }
    15%  { opacity: 0.7; }
    80%  { opacity: 0; }
    100% { transform: translateY(-14px) scale(1.15); opacity: 0; }
  }

  /* rock / spiderweb / whirlpool: invisible until a happening reveals
     them; visible-but-dim in edit mode so they can still be placed and
     repositioned. Tapping the revealed one sends a fairy running over,
     which then shrinks it away over ~3 seconds. */
  .happening-hidden{ opacity:0; pointer-events:none; transition:opacity .25s ease; }
  body.editing .happening-hidden{ opacity:0.35; pointer-events:auto; }
  .happening-active{ cursor:pointer; }
  .happening-active:hover .happening-shrink{ filter:brightness(1.12); }

  /* the inner "shrink" wrapper — always present so the transition below
     is already active by the time .happening-shrinking gets added */
  .happening-shrink{
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transition: transform 3s ease-in, opacity 3s ease-in;
  }
  .happening-shrink.happening-shrinking{
    transform: scale(0);
    opacity: 0;
  }

  .happening-wilted{ cursor:pointer; }
  .flower-sway{ transition: transform 0.6s ease, filter 3s ease; } /* static droop pose fades in/out smoothly instead of animating continuously */
  /* wilted: keep the flower's own colours, just droop it into a fixed,
     tired-looking pose instead of turning it grey (and instead of the
     old continuously-animating droop — a still pose reads just as clearly) */
  .happening-wilted .flower-sway{
    transform: rotate(33deg) scale(0.95);
  }

  .virus-root{ transform-box: fill-box; transform-origin:50% 50%; }

  /* NOTE: the old .happening-attention (filter:drop-shadow glow) is gone —
     every happening now uses the cheaper .attention-spark defined above,
     added/removed as an actual element instead of toggled by class.
     (.field-zone, used by the old whole-patch flower zone, is gone too —
     gutflora now targets one specific flower object like everything else.) */
  /* shared "please tap me" cue for every happening (rock / spiderweb /
     whirlpool / hot spring / virus / flower patch). Deliberately NOT a
     filter:drop-shadow (that's a blur + its own compositing layer per
     element — noticeably heavier than plain opacity/transform, and
     the flower patch alone can mean ~60 of these glowing at once).
     A radial-gradient dot animated with opacity/scale only composites
     cheaply on the GPU no matter how many are on screen together. */
  .attention-spark{
    opacity:.3;
    transform-box: fill-box; transform-origin:50% 50%;
    animation: attentionSparkPulse 1s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes attentionSparkPulse{
    0%,100% { opacity:.28; transform:scale(0.82); }
    50%     { opacity:.9;  transform:scale(1.1); }
  }

  /* hot spring: steam only shows while the fever happening is active */
  .steam-group{
    opacity:0; transition:opacity .3s ease;
    transform-box: fill-box; transform-origin: 50% 100%;
  }
  .onsen-steaming .steam-group{ opacity:1; }
  .onsen-steaming{ cursor:pointer; }
  .steam-group.steam-shrinking{
    transition: opacity 3s ease-in, transform 3s ease-in;
    opacity:0; transform:scale(0.25) translateY(6px);
  }

  .onsen-spark{
    fill:#ffe066;
    animation: sparkPop 0.8s ease-out forwards;
    transform-box: fill-box; transform-origin:50% 50%;
  }
  @keyframes sparkPop{
    0%   { opacity:0; transform:scale(0.4) translateY(0); }
    30%  { opacity:1; transform:scale(1.15) translateY(-6px); }
    100% { opacity:0; transform:scale(0.9) translateY(-20px); }
  }

  .fairy-group{ cursor:grab; }
  .fairy-group.dragging{ cursor:grabbing; }
  .fairy-ring{
    fill:none;
    stroke:#fff;
    stroke-width:4;
    stroke-dasharray:2 8;
    opacity:0;
    transition:opacity .15s;
    pointer-events:none;
  }
  .fairy-group.selected .fairy-ring{ opacity:.9; }

  .placed-obj{ pointer-events:none; }
  body.erase-mode .placed-obj{ pointer-events:auto; cursor:pointer; }
  .placed-path{ pointer-events:none; }
  body.erase-mode .placed-path{ pointer-events:auto; cursor:pointer; }
  .ghost-preview{ pointer-events:none; }


  /* BUGFIX: rock/spiderweb/whirlpool/hotspring/flower are also
     .placed-obj (from placeObject), so the rule above was silently
     blocking every tap on them outside of eraser mode — that was the
     actual reason clicking did nothing. This class opts them back in.
     Higher specificity (2 classes) beats the plain .placed-obj rule
     regardless of source order. */
  .placed-obj.happening-tappable{ pointer-events:auto; }
  .placed-obj.happening-hidden{ pointer-events:none !important; }
  body.editing .placed-obj.happening-hidden{ pointer-events:auto !important; }

  /* debug view: reveals the actual invisible tap/hit areas in red so
     it's easy to check they line up with what's on screen. Toggle from
     the menu — purely a diagnostic aid, safe to remove later. */
  body.debug-hitareas .happening-hit-area{
    fill:#ff2d55 !important;
    stroke:#ff2d55; stroke-width:1.5;
    opacity:0.35 !important;
  }

  /* ---- bottom UI ---- */
  #dock{
    flex:0 0 auto;
    position:relative;
    z-index:5;
    padding:10px 12px calc(10px + env(safe-area-inset-bottom));
    background:linear-gradient(180deg, transparent, #ffffffcc 30%);
    display:block;
  }
  #palette{
    display:flex;
    gap:6px;
    /* items now shrink/grow to fit the available width (see .palette-item
       flex-basis below) instead of overflowing into a horizontal scroll —
       a scrollbar here is easy to miss entirely, especially since nothing
       hinted that there were more icons off to the side */
    overflow:visible;
    padding:8px 8px 24px; /* extra bottom room for the label text below each icon, which used to get clipped */
    background:var(--panel);
    border-radius:22px;
    box-shadow:0 4px 0 var(--panel-line), 0 8px 20px #0000000f;
  }
  .palette-item{
    /* shares available width equally with the other items, shrinking
       together to fit any screen without scrolling; capped so it doesn't
       balloon on a wide/tablet screen */
    flex:1 1 0;
    min-width:0;
    max-width:60px;
    aspect-ratio:1;
    border-radius:16px;
    border:2px solid transparent;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:26px;
    cursor:pointer;
    position:relative;
  }
  .palette-item.active{
    border-color:var(--coral);
    background:#fff0f3;
    transform:translateY(-3px);
  }
  .palette-item.eraser.active{
    border-color:#c96a4e;
    background:#fdece5;
  }
  .palette-item span.label{
    position:absolute;
    bottom:-16px;
    font-size:9px;
    color:var(--ink);
    white-space:nowrap;
  }
  .palette-icon-svg{
    width:70%;
    height:70%;
    overflow:visible;
    pointer-events:none;
  }

  #camera, #scene{ touch-action:none; }

  .river-path{ pointer-events:none; }

  #hint{
    position:absolute;
    left:0; right:0; top:10px;
    display:flex;
    justify-content:center;
    pointer-events:none;
    z-index:15;
  }
  #hint span{
    background:#4a3c2ae0;
    color:#fff;
    font-size:12px;
    padding:6px 14px;
    border-radius:999px;
    opacity:0;
    transition:opacity .25s;
  }
  #hint span.show{ opacity:1; }

  /* 到着演出：スキップボタンと、場所をばらけさせるときの暗転 */
  #arrivalFade{
    position:absolute; inset:0; z-index:16;
    background:#16303b;
    opacity:0; pointer-events:none;
    transition:opacity .6s ease;
  }
  #arrivalFade.show{ opacity:1; pointer-events:auto; }
  #arrivalSkipBtn{
    display:none;
    position:absolute; right:12px; top:12px; z-index:17;
    border:none; border-radius:999px;
    padding:9px 16px;
    background:var(--panel);
    box-shadow:0 3px 0 var(--panel-line), 0 6px 14px #0000001a;
    font-size:13px; font-weight:800; color:var(--ink);
    cursor:pointer;
  }
  #arrivalSkipBtn.show{ display:block; }
  #arrivalSkipBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--panel-line); }

  #happeningCounter{
    display:flex;
    align-items:center;
  }
  #happeningCounter span{
    display:inline-block;
    white-space:nowrap;
    background:#ffe3a3e0;
    color:#8a5a1a;
    font-size:12px;
    font-weight:800;
    padding:7px 14px;
    border-radius:999px;
    box-shadow:0 3px 0 #e0b465, 0 6px 14px #0000001a;
    opacity:0;
    transform:scale(0.85);
    transition:opacity .2s ease, transform .2s ease;
  }
  #happeningCounter span.show{ opacity:1; transform:scale(1); }

  /* ---- night mode: shown once every happening on the island has been
     dealt with, blocks interaction for a short break, then clears itself.
     See NIGHT_DURATION_SEC — set short for testing. ---- */
  #nightOverlay{
    position:fixed; inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    background:radial-gradient(ellipse at 50% 30%, #2d3f78 0%, #1a2350 55%, #0e1230 100%);
    animation: nightFadeIn 1.1s ease both;
  }
  #nightOverlay.show{ display:flex; }
  @keyframes nightFadeIn{
    from{ opacity:0; }
    to{ opacity:1; }
  }
  #nightStars{
    position:absolute; inset:0;
    background-image:
      radial-gradient(#fff 1.5px, transparent 1.5px),
      radial-gradient(#fff 1px, transparent 1px),
      radial-gradient(#fff 1px, transparent 1px);
    background-size: 180px 180px, 130px 130px, 90px 90px;
    background-position: 20px 30px, 90px 110px, 40px 150px;
    opacity:.55;
  }
  #nightCard{
    position:relative;
    text-align:center;
    color:#fff;
    padding:28px 34px;
    background:#ffffff14;
    border:2px solid #ffffff33;
    border-radius:28px;
    backdrop-filter: blur(2px);
  }
  #nightMoon{
    font-size:52px;
    animation: nightMoonBob 3s ease-in-out infinite;
  }
  @keyframes nightMoonBob{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-8px); }
  }
  #nightCard p{
    margin:6px 0 0;
    font-weight:800;
  }
  #nightMsg1, #nightMsg2{ font-size:16px; }
  #nightTimer{
    margin-top:14px;
    font-size:22px;
    color:#ffe3a3;
    letter-spacing:.02em;
  }
  /* while night mode is up, nothing beneath it should be interactive —
     the overlay itself (fixed, full-screen, above everything) already
     intercepts all taps, so nothing else needs to change per-element */

  #info-panel{
    position:absolute;
    right:12px;
    top:56px;
    width:180px;
    background:var(--panel);
    border-radius:16px;
    padding:12px;
    box-shadow:0 4px 0 var(--panel-line);
    transform:translateX(220px);
    transition:transform .25s ease;
    z-index:6;
    font-size:12px;
    color:var(--ink);
  }
  #info-panel.show{ transform:translateX(0); }
  #info-panel h3{ margin:0 0 4px; font-size:14px; }
  #info-panel p{ margin:2px 0; line-height:1.5; }
  #info-panel .close-x{
    position:absolute; top:6px; right:8px; cursor:pointer; font-size:14px; color:#a99a7c;
  }
  #infoFairyStoreBtn{
    display:none; /* shown only for a fairy the person actually earned — not the fixed cast — see the JS that toggles this */
    width:100%;
    margin-top:10px;
    padding:8px 6px;
    border:none;
    border-radius:12px;
    background:#f3ece0;
    color:#8a5a1a;
    font-size:11px;
    font-weight:700;
    cursor:pointer;
  }
  #infoFairyStoreBtn:active{ background:#ebe0cf; }
  #infoFairyStoreBtn.show{ display:block; }

  /* ---------- 妖精ずかん（表示上限まわり） ---------- */
  #fairyAlbumModal{
    display:none;
    position:fixed; inset:0; z-index:90;
    background:#3a2c1acc;
    align-items:center; justify-content:center;
    padding:20px;
  }
  #fairyAlbumModal.show{ display:flex; }
  #fairyAlbumCard{
    background:var(--panel);
    border-radius:20px;
    max-width:420px; width:100%;
    max-height:80vh; overflow-y:auto;
    padding:20px 22px 26px;
    box-shadow:0 10px 0 var(--panel-line);
  }
  #fairyAlbumHead{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:6px;
  }
  #fairyAlbumHead h2{ margin:0; font-size:17px; color:var(--ink); }
  #fairyAlbumHead .close-x{
    cursor:pointer; font-size:16px; color:var(--ink);
    width:28px; height:28px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  #fairyAlbumHead .close-x:hover{ background:#f6ecd6; }
  #fairyAlbumCount{ margin:0; font-size:13px; font-weight:800; color:var(--coral-deep); }
  .album-hint{ margin:4px 0 14px; font-size:11.5px; color:#8a7a5c; line-height:1.5; }
  .album-empty{ font-size:12.5px; color:#8a7a5c; }
  .album-row{
    display:flex; align-items:center; gap:8px;
    padding:8px 0;
    border-top:1px solid var(--panel-line);
  }
  .album-row:first-child{ border-top:none; }
  .album-icon{
    width:44px; height:44px; border-radius:50%;
    flex-shrink:0;
    overflow:hidden;
    background:#ffffffaa;
    box-shadow:inset 0 0 0 1.5px #00000022;
  }
  .album-icon-svg{
    width:100%; height:100%;
    display:block;
    pointer-events:none;
  }
  .album-info{ flex:1 1 auto; min-width:0; }
  .album-name{ font-size:12.5px; font-weight:700; color:var(--ink); }
  .album-count{ font-size:10.5px; color:#8a7a5c; }
  .album-btn{
    flex-shrink:0;
    font-size:10.5px; font-weight:700;
    padding:6px 9px;
    border:none; border-radius:10px;
    background:#f3ece0; color:#8a5a1a;
    cursor:pointer;
  }
  .album-btn:disabled{ opacity:0.35; cursor:default; }
  .album-btn:not(:disabled):active{ background:#ebe0cf; }

  /* ---------- 妖精ゲット演出（ガチャ / 確定入手） ---------- */
  #youseiGetOverlay{
    display:none;
    position:fixed; inset:0; z-index:100;
    background:radial-gradient(circle at 50% 40%, #fff8e0f0, #4a3c2aef);
    align-items:center; justify-content:center;
    padding:20px;
  }
  #youseiGetOverlay.show{ display:flex; }
  #youseiGetCard{
    background:var(--panel);
    border-radius:24px;
    max-width:360px; width:100%;
    padding:22px 22px 26px;
    text-align:center;
    box-shadow:0 10px 0 var(--panel-line);
    animation:youseiPop .35s ease;
  }
  @keyframes youseiPop{
    0%{ transform:scale(0.7); opacity:0; }
    100%{ transform:scale(1); opacity:1; }
  }
  #youseiGetKind{
    display:inline-block;
    font-size:12px; font-weight:800;
    color:var(--coral-deep);
    background:#fff0f3;
    padding:4px 12px;
    border-radius:999px;
    margin-bottom:8px;
  }
  #youseiGetStage{
    width:180px; height:200px;
    margin:0 auto 6px;
  }
  #youseiGetStage svg{ width:100%; height:100%; overflow:visible; }
  #youseiGetName{ font-size:17px; font-weight:800; color:var(--ink); margin-bottom:6px; }
  #youseiGetDesc{ font-size:12.5px; color:var(--ink); line-height:1.7; margin-bottom:14px; }
  #youseiGetCount{ font-size:11px; color:#a99a7c; margin-bottom:12px; }
  #youseiGetStoredNote{ display:none; font-size:11px; color:#8a5a1a; background:#fff3d6; border-radius:10px; padding:6px 8px; margin:-6px 0 10px; }
  #youseiGetStoredNote.show{ display:block; }
  #youseiGetNextBtn{
    border:none;
    background:var(--coral);
    color:#fff;
    font-weight:800;
    font-size:14px;
    padding:11px 28px;
    border-radius:999px;
    box-shadow:0 3px 0 var(--coral-deep);
    cursor:pointer;
  }
  #youseiGetNextBtn:active{ transform:translateY(2px); box-shadow:0 1px 0 var(--coral-deep); }
</style>
</head>
<body>
<div id="app">
  <header>
    <div id="happeningCounter"><span id="happeningCounterText"></span></div>
    <div class="header-right">
      <div id="menuWrap">
        <button class="top-btn" id="menuBtn">☰ メニュー</button>
        <div id="menuDropdown">

<script>
(function(){
"use strict";

const SVGNS = "http://www.w3.org/2000/svg";
const el = (tag, attrs) => {
  const e = document.createElementNS(SVGNS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
};
const clamp = (v,min,max) => Math.max(min, Math.min(max, v));

/* ============================================================
   1b. ISLAND SILHOUETTE — deformed humanoid: head / neck / torso /
       arms / legs, all defined once and reused for both drawing
       and walkable-area hit testing.
   ============================================================ */
const BODY_PARTS = [
  {name:"head",  type:"pacman",    cx:2700, cy:1190, r:594, mouthAngle:180, mouthWidth:70, grassMargin:140},
  {name:"torso", type:"roundrect", cx:2700, cy:2700, w:1440, h:2400, rx:390, grassMargin:100},
  {name:"armL",  type:"ellipse",   cx:1770, cy:2070, rx:588, ry:300, rot:-35, grassMargin:90},
  {name:"armR",  type:"ellipse",   cx:3630, cy:2070, rx:588, ry:300, rot:35,  grassMargin:90},
  {name:"legL",  type:"ellipse",   cx:2280, cy:4410, rx:330, ry:900, rot:-8,  grassMargin:90},
  {name:"legR",  type:"ellipse",   cx:3120, cy:4410, rx:330, ry:900, rot:8,   grassMargin:90}
];

function pacmanPath(cx, cy, r, mouthAngle, mouthWidth){
  const a1 = (mouthAngle + mouthWidth/2) * Math.PI/180;
  const a2 = (mouthAngle - mouthWidth/2) * Math.PI/180;
  const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
  const x2 = cx + r*Math.cos(a2), y2 = cy + r*Math.sin(a2);
  const largeArc = (360 - mouthWidth) > 180 ? 1 : 0;
  return `M${cx},${cy} L${x1.toFixed(1)},${y1.toFixed(1)} A${r},${r} 0 ${largeArc} 1 ${x2.toFixed(1)},${y2.toFixed(1)} Z`;
}
function inPacman(x, y, cx, cy, r, mouthAngle, mouthWidth){
  const dx = x-cx, dy = y-cy;
  if(Math.hypot(dx,dy) > r) return false;
  let angle = Math.atan2(dy,dx) * 180/Math.PI;
  if(angle < 0) angle += 360;
  const mc = ((mouthAngle % 360) + 360) % 360;
  let diff = Math.abs(angle - mc);
  if(diff > 180) diff = 360 - diff;
  return diff > mouthWidth/2;
}

function drawPart(group, p, margin, fill, cyShift){
  cyShift = cyShift || 0;
  if(p.type === "circle"){
    const r = Math.max(4, p.r - margin);
    group.appendChild(el("circle", {cx:p.cx, cy:p.cy+cyShift, r, fill}));
  } else if(p.type === "pacman"){
    const r = Math.max(4, p.r - margin);
    group.appendChild(el("path", {d:pacmanPath(p.cx, p.cy+cyShift, r, p.mouthAngle, p.mouthWidth), fill}));
  } else if(p.type === "roundrect"){
    const w = Math.max(8, p.w - margin*2), h = Math.max(8, p.h - margin*2);
    const rx = Math.max(4, Math.min(p.rx - margin*0.5, w/2, h/2));
    group.appendChild(el("rect", {x:p.cx-w/2, y:p.cy-h/2+cyShift, width:w, height:h, rx, ry:rx, fill}));
  } else {
    const rx = Math.max(4, p.rx - margin), ry = Math.max(4, p.ry - margin);
    const attrs = {cx:p.cx, cy:p.cy+cyShift, rx, ry, fill};
    if(p.rot) attrs.transform = `rotate(${p.rot} ${p.cx} ${p.cy+cyShift})`;
    group.appendChild(el("ellipse", attrs));
  }
}
function buildIslandSilhouette(){
  const base = document.getElementById("islandBase");
  const grass = document.getElementById("islandGrass");
  const sandShape = p => p.type === "pacman" ? {...p, type:"circle"} : p;
  // 影（不透明な図形を1つのグループにまとめ、全体に透明度をかける＝重なっても濃くならない）
  const shadow = document.getElementById("islandShadow");
  BODY_PARTS.forEach(p => drawPart(shadow, sandShape(p), -2, "#2c220f", 37));
  BODY_PARTS.forEach(p => drawPart(shadow, sandShape(p), -2, "#2c220f", 5));
  BODY_PARTS.forEach(p => drawPart(base, sandShape(p), 0, "var(--sand-shadow)", 32));
  BODY_PARTS.forEach(p => drawPart(base, sandShape(p), 0, "var(--sand)", 0));
  BODY_PARTS.forEach(p => drawPart(grass, p, p.grassMargin, "url(#grassGrad)", 0));
}
buildIslandSilhouette();

function inRotatedEllipse(x, y, cx, cy, rx, ry, rotDeg){
  const rad = -(rotDeg||0) * Math.PI/180;
  const dx = x-cx, dy = y-cy;
  const rx2 = dx*Math.cos(rad) - dy*Math.sin(rad);
  const ry2 = dx*Math.sin(rad) + dy*Math.cos(rad);
  return (rx2*rx2)/(rx*rx) + (ry2*ry2)/(ry*ry) <= 1;
}
function inRoundRect(x, y, cx, cy, w, h, rx){
  const dx = Math.abs(x-cx), dy = Math.abs(y-cy);
  if(dx > w/2 || dy > h/2) return false;
  const rxc = Math.max(0, Math.min(rx, w/2, h/2));
  if(dx <= w/2-rxc || dy <= h/2-rxc) return true;
  const cx2 = dx-(w/2-rxc), cy2 = dy-(h/2-rxc);
  return cx2*cx2 + cy2*cy2 <= rxc*rxc;
}
function onLandmass(x, y){
  for(const p of BODY_PARTS){
    const sp = p.type === "pacman" ? {...p, type:"circle"} : p;
    if(sp.type === "circle"){
      if(Math.hypot(x-sp.cx, y-sp.cy) <= sp.r) return true;
    } else if(sp.type === "roundrect"){
      if(inRoundRect(x, y, sp.cx, sp.cy, sp.w, sp.h, sp.rx)) return true;
    } else {
      if(inRotatedEllipse(x, y, sp.cx, sp.cy, sp.rx, sp.ry, sp.rot)) return true;
    }
  }
  return false;
}

/* 「グループ報酬」：確定入手の予約に group:〜 が入っていたら、島で受け取るときに
   そのグループの3種から1体を決める。持っていない種類があればその中からランダム、
   3種とも持っていれば3種から完全ランダム。 */
const GROUP_REWARDS = {
  "group:antibiotic": ["abx1","abx2","abx3"],   // こうせいざいようせい
  "group:other":      ["misc1","misc2","misc3"] // 対応表にない薬
};
function pickGroupRewardType(token, ownedFairies){
  const list = GROUP_REWARDS[token];
  const owned = new Set(ownedFairies.map(f => f.type));
  const unowned = list.filter(t => !owned.has(t));
  const pool = unowned.length ? unowned : list;
  return pool[Math.floor(Math.random() * pool.length)];
}
/* 対応表の妖精：まだ持っていなければ基本の姿、持っていれば「まだ持っていない色違い」から、
   全部持っていれば色違い込みの10種から完全ランダムで1体決める。 */
function pickSpecificLookType(baseType, ownedFairies){
  const owned = new Set(ownedFairies.map(f => f.type));
  if(!owned.has(baseType)) return baseType;
  const looks = [baseType];
  for(let i=1; i<=NUM_COLOR_VARIANTS; i++) looks.push(`${baseType}_c${i}`);
  const unowned = looks.filter(t => !owned.has(t));
  const pool = unowned.length ? unowned : looks;
  return pool[Math.floor(Math.random() * pool.length)];
}

/* ============================================================
   2. SHARED BODY-PART HELPERS
   (all parts are rigid shapes on anchored groups; animation only
    ever translates/rotates/scales groups as a whole, so nothing
    stretches or falls apart)
   ============================================================ */
function makeLeg(side, opt, t){
  const sign = side === "L" ? -1 : 1;
  const g = el("g", {class:"leg"+side, transform:`translate(${sign*opt.spacing},${opt.anchorY})`});
  if(opt.thin){
    g.appendChild(el("rect", {x:-2, y:0, width:4, height:opt.length, rx:2, fill:t.bodyDark}));
    g.appendChild(el("path", {d:`M-5,${opt.length} q5,6 5,0 q0,6 5,0`, fill:"none", stroke:t.bodyDark, "stroke-width":2.5, "stroke-linecap":"round"}));
  } else {
    g.appendChild(el("ellipse", {cx:0, cy:opt.length/2, rx:opt.width, ry:opt.length/2, fill:t.bodyDark}));
    if(opt.hoof) g.appendChild(el("ellipse", {cx:0, cy:opt.length, rx:opt.width*0.85, ry:3, fill:"#5a4632"}));
  }
  return g;
}
function makeEar(side, type, t){
  const sign = side === "L" ? -1 : 1;
  if(type === "ossicone"){
    const eg = el("g", {transform:`translate(${sign*6},-16)`});
    eg.appendChild(el("rect", {x:-2, y:-14, width:4, height:14, fill:t.bodyDark}));
    eg.appendChild(el("circle", {cx:0, cy:-16, r:4, fill:t.bodyDark}));
    return eg;
  }
  if(type === "tiny"){
    const eg = el("g", {transform:`translate(${sign*9},-15)`});
    eg.appendChild(el("polygon", {points:`0,0 ${sign*6},-12 ${sign*-2},-2`, fill:t.body}));
    return eg;
  }
  const eg = el("g", {transform:`translate(${sign*13},-8)`});
  if(type === "long"){
    eg.appendChild(el("path", {d:`M0,0 Q${sign*10},-30 ${sign*2},-46 Q${sign*-6},-32 0,0`, fill:t.body}));
    eg.appendChild(el("path", {d:`M${sign*1},-6 Q${sign*6},-26 ${sign*1},-38`, stroke:t.belly, "stroke-width":4, fill:"none", "stroke-linecap":"round"}));
  } else if(type === "cat"){
    eg.appendChild(el("path", {d:`M${sign*-8},4 L${sign*10},-18 L${sign*2},6 Z`, fill:t.body}));
  } else if(type === "floppy"){
    // hangs down from the head instead of standing up — pig-style
    eg.appendChild(el("path", {d:`M0,-4 Q${sign*14},2 ${sign*10},20 Q${sign*2},18 0,-4 Z`, fill:t.body}));
    eg.appendChild(el("path", {d:`M${sign*2},0 Q${sign*10},4 ${sign*8},16`, stroke:t.belly, "stroke-width":3, fill:"none", "stroke-linecap":"round"}));
  } else {
    // darkEars: ears take the dark accent colour instead of the body colour
    // (panda-style) — inner ear too, so they read as solid black rather
    // than black-with-a-white-centre
    eg.appendChild(el("circle", {cx:0, cy:-10, r:11, fill:t.darkEars ? t.bodyDark : t.body}));
    eg.appendChild(el("circle", {cx:0, cy:-9, r:6, fill:t.darkEars ? t.bodyDark : t.belly}));
  }
  return eg;
}
function makeTail(type, t, anchor){
  const tg = el("g", {class:"tail", transform:`translate(${anchor.x},${anchor.y})`});
  if(type === "round"){
    tg.appendChild(el("ellipse", {cx:0, cy:0, rx:11, ry:9, fill:t.bodyDark}));
  } else if(type === "long"){
    tg.appendChild(el("path", {d:"M0,4 Q22,-2 20,-22", stroke:t.bodyDark, "stroke-width":9, fill:"none", "stroke-linecap":"round"}));
  } else if(type === "fluffy"){
    tg.appendChild(el("circle", {cx:2, cy:2, r:12, fill:t.bodyDark}));
    tg.appendChild(el("circle", {cx:-4, cy:-8, r:8, fill:t.bodyDark}));
  } else if(type === "feather"){
    [-12,0,12].forEach((a,i)=>{
      tg.appendChild(el("path", {d:`M0,0 L${a},${-18-Math.abs(a)*0.3} L${a*0.4},2 Z`, fill: i===1?t.bodyDark:t.body}));
    });
  } else if(type === "flow"){
    tg.appendChild(el("path", {d:"M0,0 Q10,20 2,42 Q-6,26 0,0", fill:t.bodyDark}));
  } else if(type === "tuft"){
    tg.appendChild(el("path", {d:"M0,0 Q4,16 2,30", stroke:t.bodyDark, "stroke-width":3.5, fill:"none", "stroke-linecap":"round"}));
    tg.appendChild(el("circle", {cx:2, cy:31, r:4, fill:t.bodyDark}));
  } else if(type === "curly"){
    // a little spiral — pig-style
    tg.appendChild(el("path", {d:"M0,0 Q10,-2 8,-10 Q6,-16 -1,-14 Q-6,-13 -4,-8", stroke:t.bodyDark, "stroke-width":4, fill:"none", "stroke-linecap":"round"}));
  }
  return tg;
}
function makeEyesAndFace(head, t){
  const eyeL = el("ellipse", {class:"eyeL", cx:-7, cy:-2, rx:2.6, ry:3.4, fill:"#3a2c1f"});
  const eyeR = el("ellipse", {class:"eyeR", cx:7, cy:-2, rx:2.6, ry:3.4, fill:"#3a2c1f"});
  head.appendChild(eyeL); head.appendChild(eyeR);
  head.appendChild(el("circle", {cx:-12, cy:5, r:3, fill:"#ff9fae", opacity:0.6}));
  head.appendChild(el("circle", {cx:12, cy:5, r:3, fill:"#ff9fae", opacity:0.6}));
  return {eyeL, eyeR};
}
// all n spots as ONE path (n subpaths, each two arcs = a circle) instead
// of n separate <ellipse> elements — same "merge into one path" trick as
// the flower petals, since a giraffe's 12 spots (7 body + 5 neck) were
// the single biggest contributor to it being the heaviest fairy to draw.
function scatterSpots(container, color, n, rx, ry, cx, cy){
  cx = cx||0; cy = cy||0;
  let d = "";
  for(let i=0;i<n;i++){
    const x = cx + (Math.random()*2-1)*rx*0.8;
    const y = cy + (Math.random()*2-1)*ry*0.8;
    const r = 2.75 + Math.random()*2.25; // was two separate rx/ry rolls — a circle reads the same at this size
    d += `M${(x-r).toFixed(1)},${y.toFixed(1)} A${r},${r} 0 1,1 ${(x+r).toFixed(1)},${y.toFixed(1)} A${r},${r} 0 1,1 ${(x-r).toFixed(1)},${y.toFixed(1)} Z `;
  }
  container.appendChild(el("path", {d:d.trim(), fill:color, opacity:0.55}));
}

function buildSmallMammal(fairy, t){
  const g = el("g", {class:"fairy-group", "data-id":fairy.id}); // filter:url(#tinyShadow) temporarily removed to test how much visual difference the per-fairy drop shadow actually makes
  // generous invisible tap target — fairies used to rely on their actual
  // visible silhouette for hit-testing, which is thin/gappy in places
  // (between legs, around wings), so taps that looked "on" the fairy
  // sometimes missed. A plain circle costs nothing extra to render.
  g.appendChild(el("circle", {cx:0, cy:0, r:48, fill:"transparent", class:"happening-hit-area"}));
  const bodyWrap = el("g", {class:"bodyWrap"});

  bodyWrap.appendChild(makeTail(t.tail, t, {x:-20, y:8}));

  const legL = el("g"); legL.appendChild(makeLeg("L", {spacing:11, anchorY:20, length:12, width:7}, t));
  const legR = el("g"); legR.appendChild(makeLeg("R", {spacing:11, anchorY:20, length:12, width:7}, t));
  legL.setAttribute("transform","translate(-11,20)");
  legR.setAttribute("transform","translate(11,20)");
  // re-anchor inner leg at 0,0 since outer g already carries anchor translate
  legL.firstChild.setAttribute("transform","translate(0,0)");
  legR.firstChild.setAttribute("transform","translate(0,0)");
  bodyWrap.appendChild(legL);
  bodyWrap.appendChild(legR);

  const body = el("g", {class:"body"});
  body.appendChild(el("ellipse", {cx:0, cy:0, rx:24, ry:22, fill:t.body}));
  body.appendChild(el("ellipse", {cx:0, cy:6, rx:14, ry:12, fill:t.belly}));
  bodyWrap.appendChild(body);
  if(t.darkArms){
    // static decorative arms hanging at the sides, tilted slightly outward —
    // the mammal rig only animates legs, so these don't move (panda: black arms)
    [-1,1].forEach(s=>{
      bodyWrap.appendChild(el("ellipse", {cx:s*21, cy:6, rx:7, ry:14, fill:t.bodyDark, transform:`rotate(${-s*12} ${s*21} 6)`}));
    });
  }

  const headWrap = el("g", {class:"headWrap", transform:"translate(0,-24)", "data-bx":"0", "data-by":"-24"});
  headWrap.appendChild(makeEar("L", t.ear, t));
  headWrap.appendChild(makeEar("R", t.ear, t));
  const head = el("g", {class:"head"});
  head.appendChild(el("circle", {cx:0, cy:0, r:20, fill:t.body}));
  head.appendChild(el("ellipse", {cx:0, cy:7, rx:11, ry:8, fill:t.belly}));
  if(t.pandaPatches){
    // drawn BEFORE the eyes, so the eyes sit on top of (not under) the patches
    head.appendChild(el("ellipse", {cx:-7, cy:-3, rx:5, ry:6.5, fill:t.bodyDark}));
    head.appendChild(el("ellipse", {cx:7, cy:-3, rx:5, ry:6.5, fill:t.bodyDark}));
  }
  const eyes = makeEyesAndFace(head, t);
  if(t.pigSnout){
    // a flat, round disc with two nostril dots — distinct from the bear's
    // more forward-projecting muzzle below
    head.appendChild(el("ellipse", {cx:0, cy:9, rx:7, ry:5.5, fill:t.snoutColor || "#e8a0a8"}));
    head.appendChild(el("ellipse", {cx:-2.2, cy:9, rx:1.3, ry:1.8, fill:"#8a5560"}));
    head.appendChild(el("ellipse", {cx:2.2, cy:9, rx:1.3, ry:1.8, fill:"#8a5560"}));
  } else if(t.snout){
    // a rounder, more forward-projecting muzzle for a bear-like face,
    // instead of the plain flat-faced default
    head.appendChild(el("ellipse", {cx:0, cy:10, rx:9, ry:7, fill:t.belly}));
    head.appendChild(el("ellipse", {cx:0, cy:8, rx:2.4, ry:1.9, fill:"#3a2c1f"}));
  } else {
    head.appendChild(el("ellipse", {cx:0, cy:6, rx:2, ry:1.6, fill:"#3a2c1f"}));
  }
  headWrap.appendChild(head);
  bodyWrap.appendChild(headWrap);

  g.appendChild(bodyWrap);
  g.appendChild(el("ellipse", {class:"fairy-ring", cx:0, cy:6, rx:36, ry:14}));
  return {g, refs:{bodyWrap, legL, legR, headWrap, eyeL:eyes.eyeL, eyeR:eyes.eyeR}};
}

function buildGiraffe(fairy, t){
  const g = el("g", {class:"fairy-group", "data-id":fairy.id}); // filter:url(#tinyShadow) temporarily removed to test how much visual difference the per-fairy drop shadow actually makes
  // generous invisible tap target — fairies used to rely on their actual
  // visible silhouette for hit-testing, which is thin/gappy in places
  // (between legs, around wings), so taps that looked "on" the fairy
  // sometimes missed. A plain circle costs nothing extra to render.
  g.appendChild(el("circle", {cx:0, cy:0, r:48, fill:"transparent", class:"happening-hit-area"}));
  const bodyWrap = el("g", {class:"bodyWrap"});

  bodyWrap.appendChild(makeTail("tuft", t, {x:-20, y:2}));

  const legL = el("g", {transform:"translate(-11,14)"});
  legL.appendChild(makeLeg("L", {spacing:0, anchorY:0, length:30, width:5, hoof:true}, t));
  const legR = el("g", {transform:"translate(11,14)"});
  legR.appendChild(makeLeg("R", {spacing:0, anchorY:0, length:30, width:5, hoof:true}, t));
  bodyWrap.appendChild(legL);
  bodyWrap.appendChild(legR);

  const body = el("g", {class:"body"});
  body.appendChild(el("ellipse", {cx:0, cy:0, rx:22, ry:16, fill:t.body}));
  body.appendChild(el("ellipse", {cx:0, cy:5, rx:12, ry:9, fill:t.belly}));
  scatterSpots(body, t.spot || t.bodyDark, 7, 20, 14);
  bodyWrap.appendChild(body);

  // long neck (fixed)
  const neck = el("path", {d:"M-6,-10 Q-2,-40 2,-66 L16,-64 Q12,-36 8,-6 Z", fill:t.body});
  bodyWrap.appendChild(neck);
  // was scattering these around (0,0) — nowhere near the neck itself,
  // which runs from about y:-66 to y:-6 — so the pattern ended up
  // floating over the body instead of on the neck. Centered on the

/* ============================================================
   3b. AUTO-GENERATED COLOR VARIANTS
   Same shape, different palette — colors are hue-rotated
   automatically instead of hand-picked, so adding many
   variants per species costs almost nothing.
   ============================================================ */
function hexToHsl(hex){
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if(max === min){ h = s = 0; }
  else{
    const d = max-min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      default: h = (r-g)/d + 4;
    }
    h *= 60;
  }
  return [h,s,l];
}
function hslToHex(h,s,l){
  h = ((h%360)+360)%360;
  const f = n=>{
    const k = (n + h/30) % 12;
    const a = s * Math.min(l, 1-l);
    const c = l - a * Math.max(-1, Math.min(k-3, Math.min(9-k, 1)));
    return Math.round(255*c).toString(16).padStart(2,"0");
  };
  return `#${f(0)}${f(8)}${f(4)}`;
}
function hueRotate(hex, deg){
  const [h,s,l] = hexToHsl(hex);
  return hslToHex(h+deg, s, l);
}
const HUE_NAMES = [
  [0,"あか"], [20,"だいだい"], [45,"こがね"], [60,"きいろ"], [90,"きみどり"],
  [120,"みどり"], [160,"エメラルド"], [180,"みずいろ"], [210,"そら"],
  [240,"あい"], [270,"むらさき"], [300,"ふじ"], [330,"もも"]
];
function nearestHueName(deg){
  deg = ((deg%360)+360)%360;
  let best = HUE_NAMES[0][1], bestDist = 999;
  HUE_NAMES.forEach(([h,name])=>{
    const d = Math.min(Math.abs(h-deg), 360-Math.abs(h-deg));
    if(d < bestDist){ bestDist = d; best = name; }
  });
  return best;
}

const NUM_COLOR_VARIANTS = 9; // + the original shape/color = 10 look-alikes per species
const PRIMARY_FIELDS = ["body","bodyDark","mane","spot","beak","foot"]; // main palette
const ACCENT_FIELDS  = ["belly"]; // torso/belly patch — can go analogous OR bold
(function generateFairyColorVariants(){
  Object.keys(FAIRY_TYPES).forEach(key=>{
    const base = FAIRY_TYPES[key];
    for(let i=1; i<=NUM_COLOR_VARIANTS; i++){
      const bodyHue = Math.round(360/(NUM_COLOR_VARIANTS+1) * i);
      // alternate style: odd = soft/analogous belly, even = bold/contrasting belly
      const isBold = (i % 2 === 0);
      const accentOffset = isBold ? (150 + (i*7)%40) : (18 + (i*5)%20);
      const accentHue = bodyHue + accentOffset;

      const variant = {...base};
      PRIMARY_FIELDS.forEach(f=>{ if(base[f]) variant[f] = hueRotate(base[f], bodyHue); });
      ACCENT_FIELDS.forEach(f=>{ if(base[f]) variant[f] = hueRotate(base[f], accentHue); });
      variant.name = `${base.name}（${nearestHueName(bodyHue)}×${nearestHueName(accentHue)}）`;
      FAIRY_TYPES[`${key}_c${i}`] = variant;
    }
  });
})();

function insideIsland(x, y){
  for(const p of BODY_PARTS){
    if(p.type === "circle"){
      const r = Math.max(4, p.r - p.grassMargin);
      if(Math.hypot(x-p.cx, y-p.cy) <= r) return true;
    } else if(p.type === "pacman"){
      const r = Math.max(4, p.r - p.grassMargin);
      if(inPacman(x, y, p.cx, p.cy, r, p.mouthAngle, p.mouthWidth)) return true;
    } else if(p.type === "roundrect"){
      const w = Math.max(8, p.w - p.grassMargin*2), h = Math.max(8, p.h - p.grassMargin*2);
      const rx = Math.max(4, Math.min(p.rx - p.grassMargin*0.5, w/2, h/2));
      if(inRoundRect(x, y, p.cx, p.cy, w, h, rx)) return true;
    } else {
      const rx = Math.max(4, p.rx - p.grassMargin), ry = Math.max(4, p.ry - p.grassMargin);
      if(inRotatedEllipse(x, y, p.cx, p.cy, rx, ry, p.rot)) return true;
    }
  }
  return false;
}

  for(let tries=0; tries<40; tries++){
    const x = 1300 + Math.random()*2500;
    const y = 900 + Math.random()*3900;
    if(insideIsland(x, y)) return {x, y};
  }
  return {x:2700, y:2500};
}

/* ============================================================
   1c. FAIRY OBSTACLE AVOIDANCE (lightweight, not full pathfinding)
   Flowers, path tiles, and the river are always walkable. Everything
   else placed on the island (trees, houses, fences, and the visible
   happening markers) is solid. Wander targets are rejected if the
   straight line to them would cross a solid object — cheap, but it's
   enough to make fences form a real enclosure and stop fairies from
   clipping through houses/trees.
   ============================================================ */
const OBSTACLE_RADIUS = { tree:26, house:55, fence:18, fenceV:18, rock:28, spiderweb:22, whirlpool:22, hotspring:40 };
/* 当たり判定の区画（グリッド）管理:
   障害物を 200x200 の区画ごとに登録しておき、判定のときは調べたい地点が
   属する1区画の障害物だけを見る。木や柵が何百個に増えても、1回の判定は
   「その場所の近くの数個」を見るだけで済む。
   登録時の半径には余白(OBSTACLE_PAD)を足してあるので、妖精の大きさ分
   (selfRadius ≤ OBSTACLE_PAD)は1区画の参照だけで取りこぼさない。
   オブジェクトを置く／消す／動かすときに invalidateObstacleGrid() を呼ぶと、
   次の判定のときに作り直される。
   「今見えているか」(happening-hidden) は変わりやすいので登録せず、
   判定のたびにその場で確認している。 */
const OBSTACLE_CELL = 200, OBSTACLE_PAD = 80;
let obstacleGrid = null;
function invalidateObstacleGrid(){ obstacleGrid = null; }
function obstacleCellKey(gx, gy){ return (gx + 1000) * 4096 + (gy + 1000); }
function buildObstacleGrid(){
  const grid = new Map();
  for(const o of state.objects){
    const baseR = OBSTACLE_RADIUS[o.type];
    if(!baseR) continue; // flower / path tiles etc. are walkable, not obstacles
    const scale = ((o.sx||1) + (o.sy||1)) / 2;
    const r = baseR*scale + OBSTACLE_PAD;
    const gx0 = Math.floor((o.x - r)/OBSTACLE_CELL), gx1 = Math.floor((o.x + r)/OBSTACLE_CELL);
    const gy0 = Math.floor((o.y - r)/OBSTACLE_CELL), gy1 = Math.floor((o.y + r)/OBSTACLE_CELL);
    for(let gx=gx0; gx<=gx1; gx++){
      for(let gy=gy0; gy<=gy1; gy++){
        const k = obstacleCellKey(gx, gy);
        let list = grid.get(k);
        if(!list){ list = []; grid.set(k, list); }
        list.push(o);
      }
    }
  }
  return grid;
}
function collidesWithObstacle(x, y, selfRadius){
  selfRadius = selfRadius || 14;
  let candidates;
  if(selfRadius > OBSTACLE_PAD){
    candidates = state.objects; // 想定外に大きい相手のときだけ、従来どおり全件確認
  } else {
    if(!obstacleGrid) obstacleGrid = buildObstacleGrid();
    candidates = obstacleGrid.get(obstacleCellKey(Math.floor(x/OBSTACLE_CELL), Math.floor(y/OBSTACLE_CELL)));
    if(!candidates) return false;
  }
  for(const o of candidates){
    const baseR = OBSTACLE_RADIUS[o.type];
    if(!baseR) continue;
    if(o.dom.classList.contains("happening-hidden")) continue; // not currently visible/physical
    const scale = ((o.sx||1) + (o.sy||1)) / 2;
    if(Math.hypot(x-o.x, y-o.y) < baseR*scale + selfRadius) return true;
  }
  return false;
}
function pathBlocked(x0, y0, x1, y1, selfRadius){
  const steps = 6;
  for(let i=1; i<=steps; i++){
    const t = i/steps;
    if(collidesWithObstacle(x0+(x1-x0)*t, y0+(y1-y0)*t, selfRadius)) return true;
  }
  return false;
}

function buildSpiderweb(){
  const outer = el("g");
  const inner = el("g", {class:"happening-shrink", opacity:"0.92", filter:"url(#tinyShadow)"});
  const r = 24;
  const spokes = 7;
  const anchors = [];
  for(let i=0;i<spokes;i++){
    const a = -Math.PI/2 + (i/spokes)*Math.PI*2;
    anchors.push([Math.cos(a)*r, Math.sin(a)*r]);
    inner.appendChild(el("line", {x1:0, y1:0, x2:Math.cos(a)*r, y2:Math.sin(a)*r, stroke:"#f4f6fa", "stroke-width":1, opacity:"0.8"}));
  }
  // sagging silk rings — quadratic curves between spokes instead of straight
  // segments, so each strand droops naturally like real spider silk
  [0.4,0.65,0.88,1.05].forEach(f=>{
    let d = "";
    for(let i=0;i<=spokes;i++){
      const idx = i % spokes;
      const [ax,ay] = anchors[idx];
      const px = ax*f, py = ay*f;
      if(i===0){ d += `M ${px},${py} `; continue; }
      const [pax,pay] = anchors[(idx+spokes-1)%spokes];
      const midx = (pax*f+px)/2, midy = (pay*f+py)/2;
      const sag = 1 + (r*f)*0.06;
      d += `Q ${midx*sag},${midy*sag} ${px},${py} `;
    }
    inner.appendChild(el("path", {d, fill:"none", stroke:"#f4f6fa", "stroke-width":0.9, opacity:"0.75"}));
  });
  // dew-glint highlights
  [[6,-14],[-10,6],[13,10]].forEach(p=>{
    inner.appendChild(el("circle", {cx:p[0], cy:p[1], r:1.1, fill:"#ffffff", opacity:"0.85"}));
  });

  spider.appendChild(el("ellipse", {cx:0, cy:2.5, rx:2.6, ry:3.2, fill:"#3d3a3f"}));

  [[-2.4,-1.4],[-2.4,1.4],[2.4,-1.4],[2.4,1.4]].forEach(p=>{
    spider.appendChild(el("path", {d:`M ${p[0]*0.3},${p[1]*0.3} Q ${p[0]*1.4},${p[1]*0.6} ${p[0]*2.2},${p[1]*1.7}`, stroke:"#3d3a3f", "stroke-width":0.7, fill:"none", "stroke-linecap":"round"}));
  });

  const hit = el("circle", {cx:0, cy:0, r:28, fill:"transparent", class:"happening-hit-area"});
  outer.appendChild(hit);
  outer.appendChild(inner);
  return outer;
}

function buildVirus(){
  const outer = el("g", {class:"virus-root"});
  const shrink = el("g", {class:"happening-shrink"}); // shrinks away when cured
  // wraps the whole creature at 3x size (originally 4x per an earlier
  // request that viruses were too small to tap reliably; brought down to
  // 3x afterward). This can't just be a bigger radius on every shape
  // below — it's a separate plain-attribute transform on its own wrapping
  // group, kept OUTSIDE .virus-bob on purpose: .virus-bob has its own CSS
  // transform animation (the wobble), and a CSS transform on an element
  // always overrides any transform="" attribute on that same element, so
  // a scale attribute placed directly on .virus-bob would just get
  // silently discarded the moment the wobble animation kicks in.
  const scaleWrap = el("g", {transform:"scale(3)"});
  // no filter here on purpose — .virus-bob is continuously animated
  // (steps(63) wobble) for as long as the virus exists, i.e. always, and
  // a filtered+animated element needs its own composited layer kept live
  // the whole time; same reasoning as dropping the fairies' shadow filter
  const bob = el("g", {class:"virus-bob"});
  bob.appendChild(el("circle", {cx:0, cy:0, r:14, fill:"#9cc95f"})); // flat colour, no gradient, per request

    bob.appendChild(el("circle", {cx:p[0], cy:p[1], r:p[2], fill:"#87b955", opacity:"0.55"}));
  });
  const spikes = 9;
  for(let i=0;i<spikes;i++){
    const a = (i/spikes)*Math.PI*2 + 0.2;
    const wob = 1 + Math.sin(i*2.1)*0.12;
    const x1 = Math.cos(a)*14, y1 = Math.sin(a)*14;
    const x2 = Math.cos(a)*(19*wob), y2 = Math.sin(a)*(19*wob);
    bob.appendChild(el("line", {x1, y1, x2, y2, stroke:"#88b957", "stroke-width":2.2, "stroke-linecap":"round"}));
    bob.appendChild(el("circle", {cx:x2, cy:y2, r:2.8, fill:"#a8d16c"}));

  bob.appendChild(el("ellipse", {cx:-4, cy:-1, rx:1.4, ry:1.8, fill:"#3a3a1f"}));
  bob.appendChild(el("ellipse", {cx:4, cy:-1, rx:1.4, ry:1.8, fill:"#3a3a1f"}));
  bob.appendChild(el("path", {d:"M -3,5 Q 0,8 3,5", stroke:"#3a3a1f", "stroke-width":1.2, fill:"none", "stroke-linecap":"round"}));
  // hit area lives outside the scale wrapper, in outer's own (unscaled)
  // coordinate space, so its radius is set directly to the 3x-equivalent
  // size (36*3) instead of being scaled implicitly
  const hit = el("circle", {cx:0, cy:0, r:108, fill:"transparent", class:"happening-hit-area"});

const HIDDEN_UNTIL_TRIGGERED = ["rock","spiderweb","whirlpool"];
function placeObject(type, x, y, sx, sy){
  sx = sx || 1; sy = sy || 1;
  const info = OBJECT_TYPES[type];
  const g = info.build();
  g.setAttribute("transform", `translate(${x},${y}) scale(${sx},${sy})`);
  g.classList.add("placed-obj");
  decorLayer.appendChild(g);
  const rec = {id: state.nextObjId++, type, x, y, sx, sy, dom:g};
  state.objects.push(rec);
  invalidateObstacleGrid();
  reorderDecorLayer();

  // happening markers: rock/spiderweb/whirlpool stay invisible until a
  // happening reveals one; hotspring/flower are visible always but react
  // to their own happening state. All are tap-to-resolve. "happening-tappable"
  // opts them out of the .placed-obj default of pointer-events:none (which
  // otherwise only allows interaction in eraser mode).
  if(HIDDEN_UNTIL_TRIGGERED.includes(type)){
    g.classList.add("happening-hidden", "happening-tappable");
    wireHappeningTap(g, h => h.targetObj === rec);
  } else if(type === "hotspring"){
    g.classList.add("happening-tappable");
    wireHappeningTap(g, h => h.targetObj === rec);
  }
  // note: flowers are NOT wired for tap here — most are just decoration.
  // The one "main" curated flower used for the gutflora happening gets
  // wired separately, after all of START_FLOWERS is placed and the
  // biggest one is known — see mainFlowerObj.
  return rec;
}
function eraseObject(domEl){
  const idx = state.objects.findIndex(o => o.dom === domEl);
  if(idx >= 0) state.objects.splice(idx,1);
  invalidateObstacleGrid();
  domEl.remove();
  showHint("消したよ");
}
// keeps decorLayer's children ordered by y (their own translate y, read
// straight off the transform attribute — cheap enough since it only runs
// on placement/move, never per-frame) so anything lower on screen draws
// in front of anything higher, like a simple painter's-algorithm depth
// sort. Objects temporarily pulled into happeningsLayer (see
// bringToHappeningFront) are just absent from decorLayer.children while
// that's the case, which is fine — they get folded back in and re-sorted
// once returned.
function reorderDecorLayer(){
  const items = [...decorLayer.children];
  items.sort((a,b) => {
    const ay = parseFloat(a.getAttribute("transform").match(/,([-\d.]+)\)/)[1]);
    const by = parseFloat(b.getAttribute("transform").match(/,([-\d.]+)\)/)[1]);
    return ay - by;
  });
  items.forEach(i => decorLayer.appendChild(i));
}

/* ---- rivers: simple freehand water paths ---- */
function pointsToPathD(points){
  if(points.length === 0) return "";
  return "M" + points.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(" L");
}
// 川の出口：砂浜（頭の円）の外のふち(x≈2107)まで川は不透明のまま（砂の色が透けない）。
// そのふちから先、川の先端(x=2058)までの「海の上の部分」だけを、なめらかに透明にする。
const RIVER_OUTLET_END_X = 2108;
function renderRivers(){
  riverLayer.innerHTML = "";
  state.rivers.forEach(r=>{
    if(r.points.length < 2) return;
    const g = el("g", {class:"river-path", "data-river-id":r.id});
    const round = {fill:"none", "stroke-linecap":"round", "stroke-linejoin":"round"};
    const k = r.points.findIndex(p => p[0] >= RIVER_OUTLET_END_X);
    if(k > 0 && r.points[0][0] < RIVER_OUTLET_END_X - 20){
      // 出口（口の外へ出ていく部分）と、ふつうの川に分けて描く。
      // 縁取り(濃い色)を先に全部描き、そのあとで中の水(明るい色)を描くことで、つなぎ目に境目が出ない。
      const dOut = pointsToPathD(r.points.slice(0, k+1));
      const dMain = pointsToPathD(r.points.slice(k));
      g.appendChild(el("path", {...round, d:dOut,  stroke:"url(#riverOutletDeep)",  "stroke-width":72}));
      g.appendChild(el("path", {...round, d:dMain, stroke:"var(--water-deep)",      "stroke-width":72}));
      g.appendChild(el("path", {...round, d:dOut,  stroke:"url(#riverOutletWater)", "stroke-width":48}));
      g.appendChild(el("path", {...round, d:dMain, stroke:"var(--water)",           "stroke-width":48}));
    } else {
      const d = pointsToPathD(r.points);
      g.appendChild(el("path", {...round, d, stroke:"var(--water-deep)", "stroke-width":72}));
      g.appendChild(el("path", {...round, d, stroke:"var(--water)",      "stroke-width":48}));
    }
    riverLayer.appendChild(g);
    r.dom = g;
  });
}

/* shared attention-spark helpers — see .attention-spark in the CSS for why
   this replaced the old filter:drop-shadow "happening-attention" glow.
   The spark is appended directly inside the happening's own DOM element,
   in its local coordinate space, so cx/cy are small offsets from that
   object's own center rather than scene coordinates. Declared here (ahead
   of spawnVirus/scatterViruses below, which run immediately) since it's

function addAttentionSpark(parentDom, cx, cy, r){
  const spark = el("circle", {cx:cx||0, cy:cy||0, r:r||20, fill:"url(#flowerGlowGrad)", class:"attention-spark"});

// per-type offsets so the dot sits roughly centered on each shape (they're
// all built around local origin (0,0), just with different silhouettes)
const ATTENTION_SPARK_SPEC = {
  rock:      {cy:0,  r:26},
  spiderweb: {cy:0,  r:22},
  whirlpool: {cy:0,  r:22},
  hotspring: {cy:16, r:26}, // was 34 — the hot spring itself is big, but the glow didn't need to be quite that big too
  virus:     {cy:0,  r:45}, // scaled to match the 3x virus body

};

/* ---- rendering priority: characters > happenings > everything else
   (which is itself y-sorted, see reorderDecorLayer above). A rock/
   spiderweb/whirlpool/hotspring/flower is a normal decoration most of the
   time and only needs to jump above ordinary decorations while its
   happening is active — moving it into happeningsLayer (the second-to-
   last child of the <svg>, above decorLayer but below fairiesLayer) does
   that directly; reparenting an existing element is instant and doesn't
   rebuild anything. spawnVirus goes straight into happeningsLayer
   instead, since a virus doesn't have a "normal, not-currently-a-
   happening" decoration state the way the others do — it's always
   mid-happening from the moment it spawns. fairiesLayer is the very last
   child of the <svg>, so a fairy running over to fix something stays
   visible instead of vanishing behind the happening itself. */
function bringToHappeningFront(dom){
  happeningsLayer.appendChild(dom);
}
function sendBackFromHappeningFront(dom){
  decorLayer.appendChild(dom);
  reorderDecorLayer(); // drop it back into its correct y-sorted spot
}

const happeningCounterEl = document.getElementById("happeningCounter");
const happeningCounterText = document.getElementById("happeningCounterText");

/* ---- night mode ----
   Once the last outstanding happening is dealt with, the island goes to
   sleep for a bit — a full-screen overlay blocks all interaction and
   counts down, both as a "you're all caught up" reward and as a soft
   nudge against playing for too long in one sitting.
   NIGHT_DURATION_SEC is short right now for testing — swap it for a
   real number of minutes (e.g. 20*60) once the flow is confirmed.
   Also declared up here for the same hoisting reason as above; finishResolve
   (defined below) calls enterNightMode() as soon as it empties the list.

   PERSISTENCE: the whole point of this feature is to discourage playing
   too much in one sitting, so it needs to survive the tab being closed —
   otherwise closing and reopening the page would just cancel the wait.
   NIGHT_STORAGE_KEY holds the wall-clock timestamp (Date.now(), NOT
   performance.now() — that resets on every page load and can't be
   compared across reloads) that night mode ends at. resumeNightModeIfNeeded()
   is called once at startup (see the bottom of the animation-loop section)
   to pick this back up if the page was closed mid-night. */
const NIGHT_DURATION_SEC = 30; // TEST VALUE — replace with the real duration later
const NIGHT_STORAGE_KEY = "kusuri_yousei_night_ends_at";
const nightOverlayEl = document.getElementById("nightOverlay");
const nightTimerEl = document.getElementById("nightTimer");
let nightIntervalId = null;

function formatNightRemaining(sec){
  if(sec >= 60){
    return `あと${Math.ceil(sec/60)}ふん`;
  }
  return `あと${sec}びょう`; // under a minute — show seconds so the test duration is actually watchable
}

// existingEndsAt: pass this when resuming a night that was already in
// progress before the page loaded (see resumeNightModeIfNeeded) — omit it
// to start a brand new one from right now.
function enterNightMode(existingEndsAt){
  if(state.night) return;
  state.night = true;
  nightOverlayEl.classList.add("show");
  const endsAt = existingEndsAt || (Date.now() + NIGHT_DURATION_SEC*1000);
  try{ window.localStorage.setItem(NIGHT_STORAGE_KEY, String(endsAt)); }catch(e){}
  const tickTimer = ()=>{
    const remainingSec = Math.max(0, Math.ceil((endsAt - Date.now())/1000));
    nightTimerEl.textContent = formatNightRemaining(remainingSec);
    if(remainingSec <= 0){
      clearInterval(nightIntervalId);
      exitNightMode();
    }
  };
  tickTimer();
  nightIntervalId = setInterval(tickTimer, 1000);
}
function exitNightMode(){
  const wasNight = state.night;
  state.night = false;
  nightOverlayEl.classList.remove("show");
  clearInterval(nightIntervalId);
  try{ window.localStorage.removeItem(NIGHT_STORAGE_KEY); }catch(e){}
  if(wasNight){
    // the animation loop stops itself while state.night is true (see
    // tick()) — give it a fresh timestamp so fairies don't jump on waking
    // up, and ask for a frame again since nothing else will if the loop
    // was genuinely stopped. (scheduleTick() is safe to call even if a
    // frame is already pending — see its own comment — which matters for
    // the resumeNightModeIfNeeded() startup path below.)
    lastFrameT = performance.now();
    lastWanderT = lastFrameT;
    lastVirusT = lastFrameT;
    scheduleTick();
  }
  runMorningBurst();
}
function runMorningBurst(){
  // morning: give the island a handful of fresh things to do right away
  // rather than waiting for the periodic schedule to slowly trickle them
  // in. triggerHappening() already skips types that are already active,
  // so three back-to-back calls naturally come out as three different ones.
  for(let i=0; i<3; i++) triggerHappening();
  // ...and reset the periodic-schedule clock from this moment, so the
  // regular 10-minute-cooldown trigger doesn't immediately pile on more
  // right on top of this batch.
  try{ window.localStorage.setItem("kusuri_yousei_last_happening_at", String(Date.now())); }catch(e){}
}
// called once at startup (see bottom of the animation-loop section) —
// picks night mode back up if the tab was closed/reloaded mid-countdown,
// or runs the wake-up burst directly if the countdown finished while gone.
function resumeNightModeIfNeeded(){
  let storedEndsAt = 0;
  try{ storedEndsAt = +window.localStorage.getItem(NIGHT_STORAGE_KEY) || 0; }catch(e){}
  if(!storedEndsAt) return;
  if(storedEndsAt > Date.now()){
    enterNightMode(storedEndsAt);
  } else {
    try{ window.localStorage.removeItem(NIGHT_STORAGE_KEY); }catch(e){}
    runMorningBurst();
  }
}

function spawnVirus(x, y){
  const g = buildVirus();
  g.setAttribute("transform", `translate(${x},${y})`);
  addAttentionSpark(g, 0, ATTENTION_SPARK_SPEC.virus.cy, ATTENTION_SPARK_SPEC.virus.r);
  bringToHappeningFront(g); // a virus is always its own active happening — always frontmost, never sent back
  const rec = {x, y, targetX:x, targetY:y, phase:Math.random()*10, wanderAt:0, dom:g};
  state.viruses.push(rec);
  wireHappeningTap(g, h => h.targetVirus === rec);
  // every virus is, from the moment it appears, its own tappable
  // "germs" happening — no need to wait for the periodic trigger
  state.activeHappenings.push({typeId:"germs", targetObj:null, targetVirus:rec, x, y, phase:"idle", respondingFairy:null});
  updateHappeningCounter();
}
(function scatterViruses(){
  const VIRUS_COUNT = 4;
  let seed = 4242;
  function rand(){ seed = (seed*1103515245 + 12345) & 0x7fffffff; return seed/0x7fffffff; }
  let placed = 0, attempts = 0;
  while(placed < VIRUS_COUNT && attempts < 800){
    attempts++;
    const x = rand()*5400, y = rand()*5900;
    if(!insideIsland(x,y)) continue;
    spawnVirus(x,y);
    placed++;
  }
})();
